          : '/auth/discord';
        window.location.href = url;
      };

      // ── Generic wallet connect helper ─────────────────────────────────────
      const connectWallet = async (chain, getAddrAndSig) => {
        setProfileError(null);
        setWalletConnecting(chain);
        try {
          const { address, signature, key } = await getAddrAndSig();

          // Get nonce
          const { nonce } = await fetch('/api/auth/nonce', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address })
          }).then(r => r.json());

          // Sign nonce — also capture key here (Cardano CIP-30 returns it with the signature)
          const { signedSig, key: sigKey } = await getAddrAndSig(nonce);

          // Submit to backend
          const res = await fetch('/api/auth/wallet-login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(authToken ? { Authorization: `Bearer ${authToken}` } : {})
            },
            body: JSON.stringify({ chain, address, signature: signedSig, key: sigKey, nonce })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Connection failed');

          if (!authToken && data.token) {
            setAuthToken(data.token);
            localStorage.setItem('cl_token', data.token);
          }
          if (data.profile) setUserProfile(data.profile);
          else if (authToken) {
            // Re-fetch profile after linking
            const p = await authFetch('/api/profile').then(r => r.json());
            setUserProfile(p);
          }
        } catch (e) {
          console.error(chain + ' connect error:', e);
          setProfileError(e.message || 'Connection failed');
        }
        setWalletConnecting(null);
      };

      // ── Multi-family wallet discovery and profile linking ────────────────
      const closePicker = () => {
        setWalletPickerType(null);
        setWalletProviders([]);
        setWalletDiscovering(false);
        setPasteMode(false);
        setPasteAddr('');
        setPasteError('');
      };

      const openWalletPicker = async (walletType) => {
        setProfileError(null);
        setWalletPickerType(walletType);
        setWalletProviders([]);
        setPasteMode(false);
        setPasteAddr('');
        setPasteError('');
        setWalletDiscovering(true);

          setWalletProviders(await discoverWalletProviders(walletType, window));
        } catch (error) {
          console.error(`${walletType} provider discovery error:`, error);
          setPasteError('Wallet discovery failed. You can still add an address manually.');
        } finally {
          setWalletDiscovering(false);
        }
      };

      const connectEVM = () => openWalletPicker('evm');
      const connectSolana = () => openWalletPicker('solana');
      const connectCardano = () => openWalletPicker('cardano');

      const connectEVMWithProvider = (record) => {
        const provider = record.provider || record;
        let address = null;
        closePicker();
        connectWallet('evm', async (nonce) => {
          if (!address) {
            const accounts = await provider.request({ method: 'eth_requestAccounts' });
            address = accounts?.[0];
          }
          if (!address) throw new Error('The wallet did not return an EVM account');
          if (!nonce) return { address };
          const message = `ChainLens login\nAddress: ${address}\nNonce: ${nonce}`;
          // personal_sign takes params[0] as HEX. Plain text happens to work in
          // MetaMask, which sniffs the value, but a wallet that reads it as bytes
          // signs a different digest and the backend can only report the result
          // as "EVM signature mismatch". Hex is unambiguous everywhere, and it is
          // what wallet approval dialogs expect to decode for display.
          const hexMessage = '0x' + Array.from(new TextEncoder().encode(message))

      const connectSolanaWithProvider = (record) => {

          if (!account) {

              const result = await record.provider.features['standard:connect'].connect();
              account = result?.accounts?.[0];
            } else {
              const result = await record.provider.connect();
              const publicKey = result?.publicKey || record.provider.publicKey;
              account = publicKey ? { address: publicKey.toString() } : null;
            }
          }
          const address = account?.address;
          if (!address) throw new Error('The wallet did not return a Solana account');
          if (!nonce) return { address };
          const message = `ChainLens login\nAddress: ${address}\nNonce: ${nonce}`;
          const encoded = new TextEncoder().encode(message);
          let signature;
          if (record.kind === 'solana-standard') {
            const result = await record.provider.features['solana:signMessage'].signMessage({ account, message: encoded });
            signature = (Array.isArray(result) ? result[0] : result)?.signature;
          } else {
            const result = await record.provider.signMessage(encoded, 'utf8');
            signature = result?.signature || result;
          }
          if (!signature) throw new Error('The wallet did not return a Solana signature');
          const signedSig = btoa(String.fromCharCode(...new Uint8Array(signature)));

      // ── Cardano hex → bech32 address converter (no extra npm lib needed) ──
      const cardanoBech32 = (hexAddr) => {
        try {
          const CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
          const bytes = hexAddr.match(/.{1,2}/g).map(b => parseInt(b, 16));
          const hrp = 'addr';
          let acc = 0, bits = 0;
          const data5 = [];
          for (const b of bytes) {
            acc = (acc << 8) | b; bits += 8;
            while (bits >= 5) { bits -= 5; data5.push((acc >> bits) & 31); }
          }
          if (bits > 0) data5.push((acc << (5 - bits)) & 31);
          const GEN = [0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];
          const polymod = (vals) => {
            let chk = 1;
            for (const v of vals) {
              const top = chk >> 25; chk = (chk & 0x1ffffff) << 5 ^ v;
              for (let i = 0; i < 5; i++) if ((top >> i) & 1) chk ^= GEN[i];
            } return chk;
          };
          const hrpExpand = (h) => {
            const r = [];
            for (const c of h) r.push(c.charCodeAt(0) >> 5);
            r.push(0);
            for (const c of h) r.push(c.charCodeAt(0) & 31);
            return r;
          };
          const vals = [...hrpExpand(hrp), ...data5, 0,0,0,0,0,0];
          const poly = polymod(vals) ^ 1;
          const chk = Array.from({length:6}, (_,i) => (poly >> (5*(5-i))) & 31);
          return hrp + '1' + [...data5, ...chk].map(d => CHARSET[d]).join('');
        } catch(e) { return hexAddr; } // fallback: return raw hex if conversion fails
      };

          if (!validateProfileWalletAddress('cardano', address)) throw new Error('The wallet did not return a Cardano mainnet address');

          const message = `ChainLens login\nAddress: ${address}\nNonce: ${nonce}`;

        if (cgImg && el.src !== cgImg) fallbacks.push(cgImg);
        // IPFS: try two more gateways
        if (origSrc.indexOf('ipfs://') === 0 || origSrc.indexOf('/ipfs/') > -1) {
          const cid = origSrc.replace('ipfs://','').replace(/.*\/ipfs\//,'');
          fallbacks.push('https://dweb.link/ipfs/' + cid);

        let fi = 0;
        el.onerror = function() {
          fi++;
          el.src = fi < fallbacks.length ? fallbacks[fi] : svgFb;

            }
            
            console.log('  🎨 Creating new chart with', chartData.prices.length, 'data points');
            
            // Determine label frequency based on data length
            const getLabelFrequency = () => {
              const length = chartData.prices.length;
              if (length <= 100) return 10; // Show every 10th point for 1D
              if (length <= 200) return 20; // Show every 20th point for 7D
              if (length <= 365) return 30; // Show every 30th point for 1M
              return 50; // Show every 50th point for 1Y/ALL
            };
            
            const labelFreq = getLabelFrequency();
            
            // Create new chart
            chartInstanceRef.current = new Chart(ctx, {
              type: 'line',
              data: {
                labels: chartData.prices.map((p, i) => {
                  if (i % labelFreq === 0 || i === chartData.prices.length - 1) {
                    const date = new Date(p.time);
                    // Show time for 1D, date for others
                    if (chartData.timeframe === '1d') {
                      return date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                    } else if (chartData.timeframe === '7d') {
                      return date.toLocaleDateString([], {month: 'short', day: 'numeric'});
                    } else if (chartData.timeframe === '1m') {
                      return date.toLocaleDateString([], {month: 'short', day: 'numeric'});
                    } else {
                      return date.toLocaleDateString([], {year: 'numeric', month: 'short'});
                    }
                  }
                  return '';
                }),
                datasets: [{
                  label: `${chartData.name} Price (USD)`,
                  data: chartData.prices.map(p => p.price),
                  borderColor: chartData.change_24h >= 0 ? '#10b981' : '#ef4444',
                  backgroundColor: chartData.change_24h >= 0 ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)',
                  borderWidth: 2,
                  fill: true,
                  tension: 0.4,
                  pointRadius: 0,
                  pointHoverRadius: 6,
                  pointHoverBackgroundColor: chartData.change_24h >= 0 ? '#10b981' : '#ef4444',
                  pointHoverBorderColor: '#fff',
                  pointHoverBorderWidth: 2
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                  mode: 'index',
                  intersect: false
                },
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleColor: '#fff',
                    bodyColor: '#fff',
                    borderColor: chartData.change_24h >= 0 ? '#10b981' : '#ef4444',
                    borderWidth: 1,
                    padding: 12,
                    displayColors: false,
                    callbacks: {
                      label: function(context) {
                        return '$' + context.parsed.y.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6});
                      }
                    }
                  }
                },
                scales: {
                  x: {
                    grid: { display: false },
                    ticks: { maxTicksLimit: 8 }
                  },
                  y: {
                    grid: { color: 'rgba(255, 255, 255, 0.05)' },
                    ticks: {
                      callback: function(value) {
                        return '$' + value.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
                      }
                    }
                  }
                }
              }
            });
            
            console.log('  ✅ Chart created successfully!');
          } catch (error) {
            console.error('  ❌ Error creating chart:', error);
            setChartData({ error: 'Failed to render chart: ' + error.message });
          }
        } else {
          if (!chartData) console.log('  ⏸️ No chartData yet');
          if (!chartData?.prices) console.log('  ⏸️ No prices in chartData');
          if (!showChart) console.log('  ⏸️ Modal not shown');
        }
      }, [chartData, showChart]);

      const closeChart = useCallback(() => {
        setShowChart(false);
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
          chartInstanceRef.current = null;
        }
      }, []);

      const clearAll = () => {
        setEvmAddr(''); setSolAddr(''); setAdaAddr('');
        setNfts([]); setTransactions([]); setResolvedEvm(null);
        setScanIssues([]);
        setSelectedAsset(null);
        setSearchQuery('');
      };

      const resetEverything = () => {
        if (confirm("Clear all results AND unhide all previously hidden assets?")) {
            clearAll();
            // Tombstones, not a wipe: this has to un-hide on the other devices
            // too, and a device that still holds the hide would otherwise push it
            // straight back. The pre-sync arrays are cleared as well so a
            // downgrade doesn't resurrect the old list.
            unhideAll();
            localStorage.removeItem('hiddenAssets');
            localStorage.removeItem('spamAssets');
        }
      };

      // Sorting helper — stable, depends only on sortBy and nativePrices
      const sortFn = useCallback((a, b) => {
        if (sortBy === 'value') {
          const liveUsd = (asset) => {
            const v = parseFloat(asset.totalValue) || 0;
            if (v > 0) return v;
            const sym = chainStyles[asset.chain]?.native;
            const nativeUsd = sym ? (nativePrices[sym] || 0) : 0;
            if (nativeUsd <= 0) return 0;
            const bal = parseFloat(asset.balance) || 0;
            if (sym && asset.symbol?.toUpperCase() === sym.toUpperCase()) return bal * nativeUsd;
            return parseFloat(asset.nativePrice || 0) * nativeUsd;
          };
          return liveUsd(b) - liveUsd(a);
        }
        if (sortBy === 'name') return (a.name || '').localeCompare(b.name || '');
        if (sortBy === 'chain') {
          const priorityA = chainPriority[a.chain.toLowerCase()] || 99;
          const priorityB = chainPriority[b.chain.toLowerCase()] || 99;
          return priorityA - priorityB;
        }
        return 0;
      }, [sortBy, nativePrices]);

      // Base filtered list — no viewMode split, so NFT and Token grids can both
      // stay always-mounted (prevents images from reloading on tab switch)
      const baseVisible = useMemo(() => {
        return nfts.filter(nft => {
          const entry = filterEntries[assetKeyFor(nft)];
          if (entry && (entry.s === 'h' || entry.s === 's')) return false;
          if (searchQuery.trim()) {
            const query = searchQuery.toLowerCase();
            return nft.name?.toLowerCase().includes(query) || nft.symbol?.toLowerCase().includes(query);
          }
          return true;
        });
      }, [nfts, filterEntries, searchQuery]);

      // NFT grid — always computed so its <img> elements stay mounted
      const nftAssets = useMemo(() =>
        [...baseVisible.filter(nft => !nft.isToken)].sort(sortFn),
        [baseVisible, sortFn]);

      // Token grid — always computed so its <img> elements stay mounted
      const tokenAssets = useMemo(() =>
        [...baseVisible.filter(nft => nft.isToken)].sort(sortFn),
        [baseVisible, sortFn]);

      // visibleAssets used only for the stats bar count / portfolio value
      const visibleAssets = useMemo(() => {
        if (viewMode === 'nfts') return nftAssets;
        if (viewMode === 'tokens') return tokenAssets;
        return baseVisible;
      }, [viewMode, nftAssets, tokenAssets, baseVisible]);

      const totalPortfolioValue = useMemo(() => {
        return visibleAssets.reduce((sum, asset) => sum + (parseFloat(asset.totalValue) || 0), 0).toFixed(2);
      }, [visibleAssets]);

      const hiddenList = useMemo(
        () => nfts.filter(nft => (filterEntries[assetKeyFor(nft)] || {}).s === 'h'), [nfts, filterEntries]);

      const spamList = useMemo(
        () => nfts.filter(nft => (filterEntries[assetKeyFor(nft)] || {}).s === 's'), [nfts, filterEntries]);

      const appHubApps = useMemo(() => {
        const apps = appHubData?.apps || [];
        const intentMatches = matchAppHubSearch(apps, appHubSearch);
        return intentMatches.filter(appRecord => {
          const matchesCategory = appHubCategory === 'all' || appRecord.category === appHubCategory;
          const matchesChain = appHubChain === 'all' || appRecord.chains.includes(appHubChain);
          return matchesCategory && matchesChain;
        }).sort((a, b) => {
          if (appHubSort === 'name') return a.name.localeCompare(b.name);
          if (appHubSort === 'category') return a.category.localeCompare(b.category) || b.chainCount - a.chainCount;
          return b.chainCount - a.chainCount || a.name.localeCompare(b.name);
        });
      }, [appHubData, appHubSearch, appHubCategory, appHubChain, appHubSort]);

      const ALL_FEATURED_IDS = ['emonad', 'sappy-seals', 'phantom', 'opensea', 'defillama', 'relay', 'thorchain'];

      const appHubFeatured = useMemo(() => {
        if (!appHubData?.apps) return [];
        if (appHubCategory === 'all') {
          return ALL_FEATURED_IDS.map(id => appHubData.apps.find(a => a.id === id)).filter(Boolean);
        }
        return [...appHubData.apps]
          .filter(a => a.category === appHubCategory)
          .sort((a, b) => b.chainCount - a.chainCount || a.name.localeCompare(b.name))
          .slice(0, 7);
      }, [appHubData, appHubCategory]);

      useEffect(() => { setFeaturedOffset(0); }, [appHubCategory]);

      const appHubTopChains = useMemo(() => {
        return [...(appHubData?.chainStats || [])].sort((a, b) => b.count - a.count).slice(0, 6);
      }, [appHubData]);

      // Un-toggling writes 'a' (restored) rather than deleting the key: the
      // wallet on another device still holds the hide, and only a newer decision
      // outranks it. Deleting would let its next push re-hide the asset.
      const toggleHide = (e, nft) => {
        e.stopPropagation();
        const key = assetKeyFor(nft);
        setFilterState(key, (filterEntries[key] || {}).s === 'h' ? 'a' : 'h');
      };

      const toggleSpam = (e, nft) => {
        e.stopPropagation();
        const key = assetKeyFor(nft);
        setFilterState(key, (filterEntries[key] || {}).s === 's' ? 'a' : 's');
      };

      const unhideAll = () => {
        setFilterState(Object.keys(filterEntries).filter(k => filterEntries[k].s !== 'a'), 'a');
      };

      const handleScanAll = async () => {
        if (!evmAddr && !solAddr && !adaAddr) return;

        // Abort any previous in-flight scan to free browser connections + memory
        if (scanAbortRef.current) {
          scanAbortRef.current.abort();
        }
        const controller = new AbortController();
        scanAbortRef.current = controller;
        const { signal } = controller;

        setLoading(true); setNfts([]); setTransactions([]); setResolvedEvm(null);

        const issues = [];
        const resolvedByChain = Object.fromEntries(DEFAULT_CHAINS.map(chain => [chain.id, []]));
        resolvedByChain.evm = [];
        const addResolved = (chainId, address) => {
          if (!resolvedByChain[chainId].includes(address)) resolvedByChain[chainId].push(address);
        };
        const resolveAddress = async (url) => {
          setIsResolving(true);
          try {
            const response = await fetch(url, { signal });
            const data = await response.json();
            return response.ok ? data.address || null : null;
          } catch (error) {
            if (error.name !== 'AbortError') console.error('Address resolution error:', error);
            return null;
          }
        };

        // EVM address/domain bar — one address is reused across every active EVM chain.
        for (const entry of parseAddressInput(evmAddr, 'evm')) {
          if (!entry.chainId) { issues.push(`Skipped unrecognized EVM input ${truncAddr(entry.input)}`); continue; }
          let target = entry.input;
          if (entry.resolution === 'evm-domain') {
            const endpoint = target.toLowerCase().endsWith('.eth') ? 'ens' : 'unstoppable';
            target = await resolveAddress(`/api/resolve/${endpoint}/${encodeURIComponent(target)}`);
            if (target) setResolvedEvm(target);
          }
          if (target && ADDRESS_PATTERNS.evm.test(target)) addResolved('evm', target);
          else issues.push(`Could not resolve EVM input ${truncAddr(entry.input)}`);
        }

        // Account-model bar — Solana, Polkadot, and Tron are distinguishable by format.
        for (const entry of parseAddressInput(solAddr, 'account')) {
          if (!entry.chainId) { issues.push(`Skipped unrecognized account address ${truncAddr(entry.input)}`); continue; }
          let target = entry.input;
          if (entry.resolution === 'sol-domain') {
            target = await resolveAddress(`/api/resolve/sns/${encodeURIComponent(target.replace(/\.sol$/i, ''))}`);
          }
          if (target && detectAddressChain(target) === entry.chainId) addResolved(entry.chainId, target);
          else issues.push(`Could not resolve ${CHAIN_MAP[entry.chainId].label} input ${truncAddr(entry.input)}`);
        }

        // UTXO/eUTXO bar — Cardano handles and ADA, BTC, or DOGE addresses can be mixed.
        for (const entry of parseAddressInput(adaAddr, 'utxo')) {
          if (!entry.chainId) { issues.push(`Skipped unrecognized UTXO address ${truncAddr(entry.input)}`); continue; }
          let target = entry.input;
          if (entry.resolution === 'ada-handle') {
            target = await resolveAddress(`/api/resolve/handle/${encodeURIComponent(target)}`);
          }
          if (target && detectAddressChain(target) === entry.chainId) addResolved(entry.chainId, target);
          else issues.push(`Could not resolve ${CHAIN_MAP[entry.chainId].label} input ${truncAddr(entry.input)}`);
        }
        setIsResolving(false);
        setScanIssues(issues);

        const nftTasks = [], tokenTasks = [], txTasks = [];
        const sf = (url) => fetch(url, { signal }).then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        });

        // EVM — every address × every active chain
        for (const addr of resolvedByChain.evm) {
          EVM_CHAINS.forEach(chain => {
            if (!activeChains.includes(chain.id)) return;
            const encoded = encodeURIComponent(addr);
            nftTasks.push(sf(`/api/nfts/${chain.id}/${encoded}`));
            tokenTasks.push(sf(`/api/tokens/${chain.id}/${encoded}`));
            txTasks.push(sf(`/api/transactions/${chain.id}/${encoded}`));
          });
        }

        // Every non-EVM address is sent only to its detected chain adapter.
        for (const chain of [...ACCOUNT_CHAINS, ...UTXO_CHAINS]) {
          if (!activeChains.includes(chain.id)) continue;
          for (const addr of resolvedByChain[chain.id]) {
            const encoded = encodeURIComponent(addr);
            nftTasks.push(sf(`/api/nfts/${chain.id}/${encoded}`));
            tokenTasks.push(sf(`/api/tokens/${chain.id}/${encoded}`));
            txTasks.push(sf(`/api/transactions/${chain.id}/${encoded}`));
          }
        }

        try {
          const [nftResults, tokenResults, txResults] = await Promise.all([
            Promise.allSettled(nftTasks),
            Promise.allSettled(tokenTasks),
            Promise.allSettled(txTasks)
          ]);

          // Merge NFTs
          const nftCombined = nftResults.filter(r => r.status === 'fulfilled' && r.value.nfts).flatMap(r => r.value.nfts);
          const nftMap = new Map();
          nftCombined.forEach(nft => {
            const key = `${nft.chain}-${String(nft.address || nft.id || nft.mint || nft.name).toLowerCase()}`;
            if (!nftMap.has(key)) nftMap.set(key, { ...nft, isToken: false });
          });

          // Merge tokens — aggregate balances if same token across multiple addresses
          const tokenCombined = tokenResults.filter(r => r.status === 'fulfilled' && r.value.nfts).flatMap(r => r.value.nfts);
          tokenCombined.forEach(token => {
            const key = `${token.chain}-${String(token.address || token.id || token.mint || token.name).toLowerCase()}`;
            if (nftMap.has(key)) {
              const ex = nftMap.get(key);
              nftMap.set(key, { ...ex,
                balance: (parseFloat(ex.balance || 0) + parseFloat(token.balance || 0)).toFixed(4),
                totalValue: (parseFloat(ex.totalValue || 0) + parseFloat(token.totalValue || 0)).toFixed(2)
              });
            } else {
              nftMap.set(key, { ...token, isToken: true });
            }
          });

          // Filter spam NFTs
          const spamWords = ['voucher','wen','airdrop','promo','lucky','ticket','pass','jup','jupiter','unprotected','box','redeem','claim','gift','reward'];
          const filtered = Array.from(nftMap.values()).filter(asset => {
            if (asset.isToken) return true;
            const name = (asset.name || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g,"");
            return !spamWords.some(w => name.includes(w));
          });
          setNfts(filtered);

          // Merge transactions — dedup by hash
          const txCombined = txResults.filter(r => r.status === 'fulfilled' && r.value.transactions).flatMap(r => r.value.transactions);
          const txMap = new Map();
          txCombined.forEach(tx => { const k = `${tx.chain}-${tx.hash||tx.id||tx.timestamp}`; if (!txMap.has(k)) txMap.set(k, tx); });
          setTransactions(Array.from(txMap.values()).sort((a,b) => b.timestamp - a.timestamp));

          const total = Object.values(resolvedByChain).reduce((count, addresses) => count + addresses.length, 0);
          console.log(`✅ Scanned ${total} address${total !== 1 ? 'es' : ''}: ${filtered.length} assets`);
        } catch (e) {
          if (e.name === 'AbortError') return; // scan was superseded — discard
          console.error('Scan error:', e);
        }

        setLoading(false);
      };

      // Legacy handlers for backward compatibility
      const handleSearch = handleScanAll;
      const fetchTransactions = () => {}; // No longer needed

      const ChainButton = ({ id }) => {
        const style = chainStyles[id];
        const isActive = activeChains.includes(id);
        
        return (
          <button
            onClick={() => setActiveChains(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id])}
            style={isActive ? { background: style.background, color: style.foreground || '#fff' } : undefined}
            className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest transition-all border-2 
            ${isActive ? 'border-transparent shadow-lg scale-105'
            : darkMode ? 'bg-slate-800 text-slate-500 border-slate-700' : 'bg-white text-slate-300 border-slate-100'}`}>
            {style.label}
          </button>
        );
      };

      const openScannerFromSearch = ({ chain, value }) => {
        const family = PROFILE_WALLET_MAP[chain]?.family;
        if (family === 'evm') {
          setEvmAddr(value);
          setResolvedEvm(null);
        } else if (family === 'account') {
          setSolAddr(value);
        } else if (family === 'utxo') {
          setAdaAddr(value);
        }
        setActiveTab('portfolio');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openAppHubFromSearch = (query = '') => {
        setAppHubSearch(query);
        setAppHubCategory('all');
        setAppHubChain('all');
        setActiveTab('swap');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className={`min-h-screen transition-colors duration-500 ${darkMode ? 'bg-slate-950 text-white dark-scroll' : 'bg-slate-50 text-slate-900'}`}>
          <div className="max-w-[1600px] mx-auto p-4 md:p-8 pt-12">
            <div className="flex flex-col items-center mb-8">
              <div className="relative group">
                  <img 
                    src={darkMode ? "/ChainLens (dark).png" : "/ChainLens (light).png"} 
                    alt="ChainLens Logo" 
                    className={`h-32 md:h-48 w-auto object-contain transition-transform duration-700 hover:scale-105 ${loading ? 'animate-pulse-slow' : ''}`} 
                  />
                  {loading && <div className="absolute inset-0 bg-blue-500/20 blur-3xl rounded-full -z-10 animate-pulse"></div>}
              </div>
            </div>

            {/* Grid / List view — fixed top-left, mirrors dark mode toggle */}
            {activeTab === 'portfolio' && nfts.length > 0 && (
              <div className={`fixed top-4 left-4 z-50 flex items-center space-x-3 px-4 py-2.5 rounded-2xl border backdrop-blur-md transition-all ${darkMode ? 'bg-slate-900/80 border-slate-700' : 'bg-white/80 border-slate-200 shadow-md'}`}>
                <span className="text-[10px] font-bold uppercase tracking-widest opacity-60">{isListView ? 'List' : 'Grid'}</span>
                <div onClick={() => setIsListView(!isListView)} className={`switch-bg rounded-full cursor-pointer ${isListView ? 'bg-indigo-600' : 'bg-slate-300'}`}>
                  <div className={`switch-dot rounded-full bg-white shadow-lg ${isListView ? 'translate-x-6' : 'translate-x-0'}`} />
                </div>
              </div>
            )}

            {/* Theme — fixed top-right corner. A Light/Dark switch until the
                account behind it can use the MagicMoney theme set. */}
            <ThemePicker
              activeTheme={activeTheme}
              darkMode={darkMode}
              eligible={themeAccess.eligible}
              builtins={(window.chainlensThemes && window.chainlensThemes.BUILTIN_THEMES) || []}
              customs={customThemes}
              onSelect={setThemeId}
            />

            {/* Tabs */}
            <div className="flex justify-center mb-6 md:mb-10 px-2">
                <nav aria-label="Main navigation" data-testid="primary-nav-scroll" className={`flex p-1 rounded-2xl border transition-all overflow-x-auto max-w-full scrollbar-none ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100 shadow-md'}`}>
                    <button onClick={() => setActiveTab('search')} className={`min-h-11 flex-shrink-0 px-4 md:px-8 py-2.5 md:py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'search' ? (darkMode ? 'bg-white text-slate-950 shadow-lg' : 'bg-slate-950 text-white shadow-xl') : 'text-slate-400 hover:text-slate-500'}`}>Search</button>
                    <button onClick={() => setActiveTab('portfolio')} className={`min-h-11 flex-shrink-0 px-4 md:px-8 py-2.5 md:py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'portfolio' ? (darkMode ? 'bg-white text-slate-950 shadow-lg' : 'bg-slate-950 text-white shadow-xl') : 'text-slate-400 hover:text-slate-500'}`}>Scanner</button>
                    <button onClick={() => setActiveTab('swap')} className={`min-h-11 flex-shrink-0 px-4 md:px-8 py-2.5 md:py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'swap' ? (darkMode ? 'bg-white text-slate-950 shadow-lg' : 'bg-slate-950 text-white shadow-xl') : 'text-slate-400 hover:text-slate-500'}`}>App Hub</button>
                    <button onClick={() => setActiveTab('market')} className={`min-h-11 flex-shrink-0 px-4 md:px-8 py-2.5 md:py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-widest transition-all ${activeTab === 'market' ? (darkMode ? 'bg-white text-slate-950 shadow-lg' : 'bg-slate-950 text-white shadow-xl') : 'text-slate-400 hover:text-slate-500'}`}>Market</button>
                    <button onClick={() => setActiveTab('profile')} className={`min-h-11 flex-shrink-0 px-4 md:px-8 py-2.5 md:py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-widest transition-all relative ${activeTab === 'profile' ? (darkMode ? 'bg-amber-400 text-slate-950 shadow-lg' : 'bg-amber-400 text-slate-950 shadow-xl') : 'text-slate-400 hover:text-amber-400'}`}>
                      Profile
                      {userProfile && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full border-2 border-slate-900"></span>}
                    </button>
                    <button
                      onClick={() => { setShowDonate(v => !v); setShowWallet(false); setShowSimpleSwap(false); setShowChat(false); }}
                      className={`md:hidden min-h-11 flex-shrink-0 px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all ${showDonate ? (darkMode ? 'bg-white text-slate-950 shadow-lg' : 'bg-slate-950 text-white shadow-xl') : 'text-slate-400 hover:text-cyan-400'}`}>
                      Donate
                    </button>
                    <button
                      onClick={() => { setShowWallet(v => !v); setShowDonate(false); setShowSimpleSwap(false); setShowChat(false); }}
                      className={`md:hidden min-h-11 flex-shrink-0 px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all ${showWallet ? (darkMode ? 'bg-white text-slate-950 shadow-lg' : 'bg-slate-950 text-white shadow-xl') : 'text-slate-400 hover:text-cyan-400'}`}>
                      Wallet
                    </button>
                    <button
                      onClick={() => { setShowChat(v => !v); setShowSimpleSwap(false); setShowDonate(false); setShowWallet(false); }}
                      aria-label={chatBadgeLabel}
                      className={`relative md:hidden min-h-11 flex-shrink-0 px-4 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all ${showChat ? (darkMode ? 'bg-white text-slate-950 shadow-lg' : 'bg-slate-950 text-white shadow-xl') : 'text-slate-400 hover:text-cyan-400'}`}>

              <circle cx="15.5" cy="14.5" r="1.5" fill="currentColor"/>
            </svg>
            Wallet
          </button>

          {/* Donate Pop-up panel */}
          {showDonate && (
            <div className={`basis-full rounded-[1.5rem] border shadow-2xl backdrop-blur-xl p-4 w-full flex flex-col gap-2 md:basis-auto md:w-72 ${darkMode ? 'bg-slate-900/95 border-slate-700' : 'bg-white/95 border-slate-200'}`}
              style={{ animation: 'slideUp 0.2s ease-out both' }}>
              <p className={`text-[9px] font-black uppercase tracking-widest mb-1 px-1 ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>Support ChainLens</p>

              {/* PayPal */}
              <a
                href="https://www.paypal.com/donate?business=NCSTKFLQ6BX7G&no_recurring=0&item_name=Every+contribution+goes+directly+toward+building+the+next+generation+of+decentralized+tools.&currency_code=CAD"
                target="_blank"
                rel="noopener noreferrer"
                onClick={e => e.stopPropagation()}
                className={`flex items-center gap-3 px-4 py-3 rounded-xl border transition-all group ${darkMode ? 'border-[#003087]/50 hover:border-[#009cde] bg-[#003087]/20 hover:bg-[#003087]/30' : 'border-[#003087]/20 hover:border-[#003087] bg-[#003087]/5 hover:bg-[#003087]/10'}`}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M7.08 21H5l1.5-9.5H10c3 0 5-1.5 5.5-4.5C16 4 14.5 2 11 2H5L3 14.5" stroke="none"/>
                  <text x="2" y="18" fontFamily="Arial" fontWeight="900" fontSize="14" fill="#009cde">P</text>
                  <text x="7" y="18" fontFamily="Arial" fontWeight="900" fontSize="14" fill="#003087">P</text>
                </svg>
                <span className={`text-xs font-bold uppercase tracking-widest transition-colors ${darkMode ? 'text-[#009cde] group-hover:text-white' : 'text-[#003087] group-hover:text-[#003087]'}`}>Donate via PayPal</span>
                <svg className="ml-auto opacity-40 group-hover:opacity-100 transition-opacity" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 10L10 2M10 2H4M10 2V8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </a>

              {/* Divider */}
              <div className={`flex items-center gap-2 px-1 my-0.5`}>
                <div className={`flex-1 h-px ${darkMode ? 'bg-slate-800' : 'bg-slate-100'}`} />
                <span className={`text-[8px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-700' : 'text-slate-300'}`}>or crypto</span>
                <div className={`flex-1 h-px ${darkMode ? 'bg-slate-800' : 'bg-slate-100'}`} />
              </div>

              {/* Crypto addresses */}
              {[
                { label: 'EVM',  addr: '0x01faF6DFc230d755141D84d7cB980dd68f5Efe13',                                                                                                        short: '0x01faF...fe13',       color: 'text-blue-400' },
                { label: 'SOL',  addr: '3noTuHnQdHkat2w5rBx18vAACMzFUvB5LodEe5vMN98d',                                                                                                     short: '3noTu...N98d',         color: 'text-emerald-400' },
                { label: 'BTC',  addr: 'bc1qt6cx7977r8xttn5rg42d2ulnlc7agspycd600w',                                                                                                        short: 'bc1qt...600w',         color: 'text-amber-400' },
                { label: 'ADA',  addr: 'addr1q950qv0ks9t29mavulaa5jr3sk2s50r5jfsddydjs0pazrfh32tdpt7zttt4mhl6t9purm4c9rv555z7r5mulq78aleqcg9c9h', short: 'addr1q950...c9h', color: 'text-cyan-400' },
              ].map(({ label, addr, short, color }) => (
                <div key={label} onClick={e => e.stopPropagation()}
                  className={`flex items-center gap-3 px-4 py-2.5 rounded-xl border ${darkMode ? 'border-slate-800 bg-slate-800/40' : 'border-slate-100 bg-slate-50'}`}>
                  <span className={`text-[9px] font-black uppercase tracking-widest w-7 flex-shrink-0 ${color}`}>{label}</span>
                  <span className={`flex-1 font-mono text-xs truncate ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>{short}</span>
                  <button
                    onClick={() => { navigator.clipboard.writeText(addr); setCopiedDonate(label); setTimeout(() => setCopiedDonate(null), 2000); }}
                    title={`Copy ${label} address`}
                    className={`flex-shrink-0 p-1 rounded-lg transition-all ${copiedDonate === label ? 'text-emerald-400' : darkMode ? 'text-slate-500 hover:text-white hover:bg-slate-700' : 'text-slate-400 hover:text-slate-700 hover:bg-slate-200'}`}>
                    {copiedDonate === label ? (
                      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 7.5L5.5 10.5L12.5 3.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    ) : (
                      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" strokeWidth="1.4"/>
                        <path d="M10 5V3.5C10 2.67 9.33 2 8.5 2H3.5C2.67 2 2 2.67 2 3.5V8.5C2 9.33 2.67 10 3.5 10H5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                      </svg>
                    )}
                  </button>
                </div>
              ))}
            </div>
          )}

          {/* Donate Trigger button */}
          <button
            onClick={() => { setShowDonate(v => !v); setShowWallet(false); setShowSimpleSwap(false); setShowChat(false); }}
            className={`hidden md:flex items-center justify-center gap-2 px-5 py-3 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-xl border transition-all duration-200 hover:scale-105 active:scale-95 ${showDonate
              ? (darkMode ? 'bg-white text-slate-950 border-white shadow-white/10' : 'bg-slate-950 text-white border-slate-950')
              : (darkMode ? 'bg-slate-900/90 border-slate-700 text-slate-300 hover:border-cyan-500 hover:text-cyan-400 backdrop-blur-md' : 'bg-white/90 border-slate-200 text-slate-600 hover:border-cyan-400 hover:text-cyan-500 backdrop-blur-md')}`}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6.5 11.5C6.5 11.5 1.5 8 1.5 4.5C1.5 2.843 2.843 1.5 4.5 1.5C5.435 1.5 6.27 1.93 6.5 2.5C6.73 1.93 7.565 1.5 8.5 1.5C10.157 1.5 11.5 2.843 11.5 4.5C11.5 8 6.5 11.5 6.5 11.5Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" fill={showDonate ? 'currentColor' : 'none'}/>
            </svg>
            Donate
          </button>
        </div>
        </div>
      </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
