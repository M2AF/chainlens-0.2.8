  <script>
    // ── Themed palette ──────────────────────────────────────────────────────
    //
    // slate, white, blue and cyan are declared as CSS variables so a MagicMoney
    // theme can repaint the whole app without touching a single class name (see
    // /theme-engine.js for what the variables mean and why only these four
    // families move). Every other Tailwind colour is stock, on purpose: emerald,
    // red and amber carry meaning, not branding.
    //
    // <alpha-value> is what keeps bg-slate-900/60, ring-cyan-500/40 and the
    // gradient utilities working — it is substituted per class, so the variables
    // must hold SPACE-SEPARATED triplets ("15 23 42"), never "15, 23, 42".
    const clPalette = (prefix) => [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950]
      .reduce((out, stop) => {
        out[stop] = `rgb(var(--cl-${prefix}-${stop}) / <alpha-value>)`;
        return out;
      }, {});

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            white: 'rgb(var(--cl-white) / <alpha-value>)',
            slate: clPalette('slate'),
            blue: clPalette('blue'),
            cyan: clPalette('cyan'),
          },
          // ⚠ Restating Tailwind's own default, which is derived from
          // colors.blue.500 and comes out WRONG once that is a var() colour:
          // the CDN build resolves it to #93c5fd — blue-300, half a scale away —
          // and every ring-N written without a colour picks it up. Measured
          // against the CDN; a plain hex is what it resolves correctly.
          ringColor: { DEFAULT: '#3b82f6' },
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
            heading: ['Syne', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <style>
    /*
     * Stock Tailwind v3 slate / blue / cyan / white — the un-themed app.
     *
     * ⚠ This block, not theme-engine.js, is what the browser paints when no
     * theme is worn. It is declared here so a failure to load the engine leaves
     * Light and Dark looking exactly as they always have, rather than stripping
     * every colour out of the page. theme-engine.js keeps the same table for the
     * accent's luminance anchors; test/theme-engine.test.js asserts they match.
     *
     * A theme overrides these as inline properties on <html>, which win over
     * :root, and un-wearing one removes the inline property rather than writing
     * a second copy of these values.
     */
    :root {
      --cl-white: 255 255 255;
      --cl-slate-50: 248 250 252;  --cl-slate-100: 241 245 249; --cl-slate-200: 226 232 240;
      --cl-slate-300: 203 213 225; --cl-slate-400: 148 163 184; --cl-slate-500: 100 116 139;
      --cl-slate-600: 71 85 105;   --cl-slate-700: 51 65 85;    --cl-slate-800: 30 41 59;
      --cl-slate-900: 15 23 42;    --cl-slate-950: 2 6 23;

      --cl-blue-50: 239 246 255;  --cl-blue-100: 219 234 254; --cl-blue-200: 191 219 254;
      --cl-blue-300: 147 197 253; --cl-blue-400: 96 165 250;  --cl-blue-500: 59 130 246;
      --cl-blue-600: 37 99 235;   --cl-blue-700: 29 78 216;   --cl-blue-800: 30 64 175;
      --cl-blue-900: 30 58 138;   --cl-blue-950: 23 37 84;

      --cl-cyan-50: 236 254 255;  --cl-cyan-100: 207 250 254; --cl-cyan-200: 165 243 252;
      --cl-cyan-300: 103 232 249; --cl-cyan-400: 34 211 238;  --cl-cyan-500: 6 182 212;
      --cl-cyan-600: 8 145 178;   --cl-cyan-700: 14 116 144;  --cl-cyan-800: 21 94 117;
      --cl-cyan-900: 22 78 99;    --cl-cyan-950: 8 51 68;

      /* Behind the app itself. No utility class paints <body>, so without this
         an overscroll bounce shows white under a dark theme. */
      --cl-page: 248 250 252;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      scroll-behavior: smooth;
      background-color: rgb(var(--cl-page));
    }

    .modal-enter { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .dark-scroll::-webkit-scrollbar { width: 8px; }
    .dark-scroll::-webkit-scrollbar-track { background: rgb(var(--cl-slate-900)); }
    .dark-scroll::-webkit-scrollbar-thumb { background: rgb(var(--cl-slate-700)); border-radius: 10px; }
    
    /* Profile page styles */

    .chain-pill-solana { background: linear-gradient(135deg, #9945FF, #14F195); }
    .chain-pill-cardano{ background: linear-gradient(135deg, #0033AD, #00BAFF); }

    @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .slide-up { animation: slideUp 0.4s ease-out both; }
    .slide-up-2 { animation: slideUp 0.4s ease-out 0.08s both; }

    .app-hub-card {

  </style>

<body>
  <div id="root"></div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
        document.getElementById('root').innerHTML =
          '<div style="padding:2rem;font-family:monospace;color:#ff9999;background:#0f172a;min-height:100vh">' +
          '<h2 style="color:#fff;margin-bottom:1rem">ChainLens: Failed to load required scripts</h2>' +
          '<p>One or more CDN scripts did not load. Check your internet connection or try a hard refresh (Ctrl+Shift+R).</p>' +
          '<ul style="margin-top:1rem;color:#94a3b8;line-height:2">' +
          '<li>React: ' + (typeof React !== "undefined" ? "✅ loaded" : "❌ MISSING") + '</li>' +
          '<li>ReactDOM: ' + (typeof ReactDOM !== "undefined" ? "✅ loaded" : "❌ MISSING") + '</li>' +
          '<li>Babel: ' + (typeof Babel !== "undefined" ? "✅ loaded" : "❌ MISSING") + '</li>' +
          '</ul></div>';
      }
    });
  </script>

  <script src="/search-intent.js"></script>
  <script src="/search-activity.js"></script>
  <script type="text/babel" src="/search-page.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;
    const { matchApps: matchAppHubSearch } = window.ChainLensSearchIntent;
    const ChainLensSearchPage = window.ChainLensSearchPage;
    const {
      DEFAULT_CHAINS, EVM_CHAINS, ACCOUNT_CHAINS, UTXO_CHAINS,
      CHAIN_MAP, PROFILE_WALLET_TYPES, PROFILE_WALLET_MAP,
      ADDRESS_PATTERNS, detectAddressChain, parseAddressInput,
      validateProfileWalletAddress, normalizeProfileWalletAddress
    } = window.ChainLensChains;
    const { discoverWalletProviders, requestLinkedAddress } = window.ChainLensWalletProviders;
    const { keyFor: assetKeyFor, legacyKeyToCanonical, mergeEntries: mergeFilterEntries,
            sanitizeEntries: sanitizeFilterEntries } = window.assetFilterKey;

    // ── Hidden / spam assets ──────────────────────────────────────────────────
    //
    // The same list MagicMoney Wallet keeps, under the same keys, carried on the
    // ChainLens profile — hide a scam airdrop in either product and it is hidden
    // in both, on every device you are signed in on.
    //
    // localStorage is what the grid renders from, always. Signing in ADDS the
    // profile copy; it never becomes a prerequisite, and a failed request leaves
    // the local list exactly as it was.
    const FILTERS_STORE = 'cl_asset_filters_v1';
    const FILTERS_MIGRATED = 'cl_asset_filters_migrated_v1';

    /**
     * Fold the pre-sync `hiddenAssets` / `spamAssets` arrays into the entries
     * map, once. Those held our old display-id keys, which the wallet cannot
     * match — so without this, the release would look like it had forgotten
     * everything you ever hid. Stamped t=0 so ANY later decision, on any device,
     * outranks them. The old arrays are left in place, not deleted.
     */
    const migrateLegacyFilters = (entries) => {
      if (localStorage.getItem(FILTERS_MIGRATED) === '1') return entries;
      const out = Object.assign({}, entries);
      [['hiddenAssets', 'h'], ['spamAssets', 's']].forEach(([store, state]) => {
        let legacy = [];
        try { legacy = JSON.parse(localStorage.getItem(store) || '[]'); } catch { return; }
        if (!Array.isArray(legacy)) return;
        legacy.forEach(old => {
          if (typeof old !== 'string') return;
          // One old key has several readings; all are recorded, and the wrong
          // ones match no asset you hold.
          legacyKeyToCanonical(old).forEach(key => { if (!out[key]) out[key] = { s: state, t: 0 }; });
        });
      });
      try {
        localStorage.setItem(FILTERS_MIGRATED, '1');
        localStorage.setItem(FILTERS_STORE, JSON.stringify(out));
      } catch {}
      return out;
    };

    const loadStoredFilters = () => {
      try {
        return migrateLegacyFilters(sanitizeFilterEntries(JSON.parse(localStorage.getItem(FILTERS_STORE) || '{}')));
      } catch {
        return migrateLegacyFilters({});
      }
    };

    const saveStoredFilters = (entries) => {
      try { localStorage.setItem(FILTERS_STORE, JSON.stringify(entries)); } catch {}
    };

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(e) { return { error: e }; }
      render() {
        if (this.state.error) {
          return (
            <div style={{padding:'2rem',fontFamily:'monospace',color:'#ff4444',background:'#0f172a',minHeight:'100vh'}}>
              <h2 style={{color:'#fff',marginBottom:'1rem'}}>ChainLens crashed during render</h2>
              <pre style={{whiteSpace:'pre-wrap',color:'#ff9999',background:'#1e293b',padding:'1rem',borderRadius:'8px'}}>{String(this.state.error)}</pre>
              <p style={{color:'#94a3b8',marginTop:'1rem'}}>Open DevTools (F12) → Console for the full stack trace.</p>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ── AssetGrid — extracted so React keeps the same component instance
    //    across NFT↔Token tab switches, preserving all <img> loaded states ──
    const AssetGrid = React.memo(({ assets, isListView, darkMode, chainStyles,
        resolveImg, handleImgError, toggleHide, toggleSpam, setSelectedAsset,
        nativePrices, tokenMode }) => {
      return (
        <div className={`max-w-6xl mx-auto ${isListView ? "flex flex-col gap-3" : "grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6 md:gap-8"}`}>
          {assets.map((nft) => {
            const rawId = nft.address || nft.id || nft.mint || nft.name;
            const assetKey = `${nft.chain}-${String(rawId).toLowerCase()}`;
            return (
              <div key={assetKey} onClick={() => setSelectedAsset(nft)} className={`group relative overflow-hidden border transition-all cursor-pointer ${isListView ? `flex items-center gap-4 p-4 rounded-2xl ${darkMode ? 'bg-slate-900 border-slate-800 hover:border-slate-600' : 'bg-white border-slate-100 hover:shadow-lg hover:border-slate-300'}` : `rounded-[2.5rem] shadow-sm flex flex-col ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-100 hover:-translate-y-2 hover:shadow-xl'}`}`}>
                <div className="absolute top-4 right-4 z-40 flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                  <button onClick={(e) => toggleHide(e, nft)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-800/80 hover:bg-blue-500 text-white backdrop-blur-sm border border-white/10">👁️</button>
                  <button onClick={(e) => toggleSpam(e, nft)} className="w-8 h-8 flex items-center justify-center rounded-full bg-slate-800/80 hover:bg-red-600 text-white backdrop-blur-sm border border-white/10">🚫</button>
                </div>
                <div className={isListView ? "w-16 h-16 rounded-xl overflow-hidden flex-shrink-0 relative" : "aspect-square relative overflow-hidden bg-slate-100"}>
                  <img
                    src={resolveImg(nft.image || '', nft.symbol)}
                    className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                    onError={(e) => handleImgError(e, nft)}
                  />
                  <div
                    style={{ background: chainStyles[nft.chain]?.background || '#64748b', color: chainStyles[nft.chain]?.foreground || '#fff' }}
                    className={`absolute ${isListView ? 'top-1 left-1 px-1.5 py-0.5 text-[6px]' : 'top-4 left-4 px-3 py-1 text-[9px]'} rounded-full font-bold tracking-widest uppercase backdrop-blur-md border border-white/20 shadow-lg z-10`}>
                    {chainStyles[nft.chain]?.label || nft.chain}
                  </div>
                </div>
                <div className={isListView ? "flex-1 flex items-center justify-between overflow-hidden min-w-0" : "p-5 text-center"}>
                  <div className={isListView ? "flex flex-col min-w-0 flex-1 pr-4" : "flex flex-col items-center mb-2"}>
                    <p className={`font-heading font-bold uppercase tracking-tight shrink-0 ${isListView ? 'text-base md:text-lg truncate' : 'text-sm'} ${darkMode ? 'text-white' : 'text-slate-900'}`} style={{maxWidth: isListView ? '100%' : 'auto'}} title={nft.name}>{/^[0-9a-fA-F]{20,}$/.test(nft.name || '') ? (nft.symbol || 'Unknown Asset') : (nft.name || 'Unknown')}</p>
                    {isListView && <span className="text-[10px] font-bold opacity-40 uppercase tracking-widest truncate" style={{maxWidth: '100%'}}>{nft.symbol || 'ASSET'}</span>}
                  </div>
                  {(nft.isToken || tokenMode) && (
                    <div className={isListView ? "flex flex-col items-end justify-center gap-1 text-right shrink-0" : "flex flex-col items-center gap-1 mt-2 pt-2 border-t border-slate-100 dark:border-slate-800"}>
                      <p className="text-emerald-500 font-bold text-sm md:text-lg leading-tight whitespace-nowrap">
                        {nft.balance} <span className="text-[10px] opacity-60">{nft.symbol}</span>
                      </p>
                      <span className={`font-bold uppercase tracking-tighter text-sm md:text-base whitespace-nowrap ${darkMode ? 'text-blue-400' : 'text-blue-600'}`}>
                        {(() => {
                          const sym = chainStyles[nft.chain]?.native;
                          const nativeUsd = sym ? (nativePrices[sym] || 0) : 0;
                          const totalUsd = parseFloat(nft.totalValue) || 0;
                          const bal = parseFloat(nft.balance) || 0;
                          if (sym && nft.symbol?.toUpperCase() === sym.toUpperCase()) return bal.toFixed(4);
                          if (nativeUsd > 0 && totalUsd > 0) return (totalUsd / nativeUsd).toFixed(4);
                          return parseFloat(nft.nativePrice || 0).toFixed(4);
                        })()} {chainStyles[nft.chain]?.native || '???'}
                      </span>
                      <span className={`font-bold uppercase tracking-tighter text-xs md:text-sm opacity-70 whitespace-nowrap ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                        ${(() => {
                          const backendVal = parseFloat(nft.totalValue) || 0;
                          if (backendVal > 0) return backendVal.toFixed(2);
                          const sym = chainStyles[nft.chain]?.native;
                          const nativeUsd = sym ? (nativePrices[sym] || 0) : 0;
                          if (nativeUsd <= 0) return '0.00';
                          const bal = parseFloat(nft.balance) || 0;
                          if (sym && nft.symbol?.toUpperCase() === sym.toUpperCase())
                            return (bal * nativeUsd).toFixed(2);
                          return (parseFloat(nft.nativePrice || 0) * nativeUsd).toFixed(2);
                        })()}
                      </span>
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      );
    });

    const AddressInputSummary = React.memo(({ value, family, darkMode }) => {
      const entries = parseAddressInput(value, family).filter(entry => entry.chainId);
      if (!entries.length) return null;
      const shortAddress = address => address.length > 18
        ? `${address.slice(0, 7)}…${address.slice(-6)}`
        : address;
      return (
        <div className="flex flex-wrap gap-1.5" aria-label={`${family} addresses loaded`} aria-live="polite">
          {entries.map((entry, index) => {
            const chain = entry.chainId === 'evm'
              ? { label: 'EVM Chains', native: 'EVM', hex: 'F97316' }
              : CHAIN_MAP[entry.chainId];
            return (
              <span key={`${entry.chainId}-${entry.input}-${index}`} title={`${chain.label}: ${entry.input}`}
                aria-label={`${chain.label} address ${entry.input}`}
                className={`inline-flex max-w-full items-center gap-1.5 px-2 py-1 rounded-lg border text-[9px] font-bold ${darkMode ? 'bg-slate-950/70 border-slate-700 text-slate-300' : 'bg-white border-slate-200 text-slate-600'}`}>
                <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ backgroundColor: `#${chain.hex}` }}></span>
                <strong style={{ color: `#${chain.hex}` }}>{chain.native}</strong>
                <span className="font-mono truncate">{shortAddress(entry.input)}</span>
              </span>
            );
          })}
        </div>
      );
    });

    // ── ChainLens Messenger ─────────────────────────────────────────────────
    // A compact MSN-inspired popup shared by World Chat and friend DMs. The
    // existing ChainLens JWT remains the only browser credential; every API
    // route independently enforces wallet + social eligibility.
    const mergeChatMessages = (current, incoming) => {
      const byId = new Map(current.map(message => [String(message.id), message]));
      (incoming || []).forEach(message => byId.set(String(message.id), message));
      return [...byId.values()].sort((a, b) => Number(a.id) - Number(b.id));
    };

    const formatChatTime = (value) => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    };

    const CHAT_LINK_SOURCE = '(?:\\b[a-z][a-z0-9+.-]*:\\/\\/[^\\s<]+|\\bmailto:[^\\s<]+|\\bwww\\.[^\\s<]+|\\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}(?:[/?#][^\\s<]*)?)';
    const chatTextContainsLink = (value) => new RegExp(CHAT_LINK_SOURCE, 'i').test(String(value || ''));
    const renderChatText = (content, allowLinks) => {
      if (!allowLinks) return content;
      return String(content).split(new RegExp(`(${CHAT_LINK_SOURCE})`, 'gi')).map((part, index) => {
        if (!new RegExp(`^(?:${CHAT_LINK_SOURCE})$`, 'i').test(part)) return part;
        if (/^[a-z][a-z0-9+.-]*:\/\//i.test(part) && !/^https?:\/\//i.test(part)) return part;
        const href = /^(?:https?:\/\/|mailto:)/i.test(part) ? part : `https://${part}`;
        return <a key={`${part}-${index}`} href={href} target="_blank" rel="noopener noreferrer"
          className="font-bold underline decoration-current/50 underline-offset-2 hover:decoration-current">{part}</a>;
      });
    };

    const ChatAvatar = ({ profile, size = 34 }) => {
      const name = profile?.display_name || 'ChainLens user';
      const initials = name.split(/\s+/).map(part => part[0]).join('').slice(0, 2).toUpperCase();
      const hue = [...String(profile?.id || name)].reduce((sum, char) => sum + char.charCodeAt(0), 0) % 360;
      return profile?.avatar_url ? (
        <img src={profile.avatar_url} alt="" referrerPolicy="no-referrer"
          className="rounded-full object-cover flex-shrink-0"
          style={{ width: size, height: size }} />
      ) : (
        <span className="rounded-full flex items-center justify-center flex-shrink-0 text-white font-black"
          style={{ width: size, height: size, fontSize: Math.max(9, size * 0.32), background: `linear-gradient(135deg,hsl(${hue} 75% 55%),hsl(${(hue + 50) % 360} 70% 42%))` }}>
          {initials || 'CL'}
        </span>
      );
    };

    const ChatMessage = ({ message, own, darkMode, allowLinks, deleting, onDelete, onMediaLoad }) => (
      <div className={`flex gap-2.5 ${own ? 'flex-row-reverse' : ''}`} data-message-id={message.id}>
        <ChatAvatar profile={message.author} size={30} />
        <div className={`min-w-0 max-w-[78%] ${own ? 'text-right' : ''}`}>
          <div className={`flex items-baseline gap-2 mb-1 ${own ? 'justify-end' : ''}`}>
            <span className={`text-[10px] font-black truncate ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>
              {message.author?.display_name || 'ChainLens user'}
            </span>
            <span className={`text-[8px] flex-shrink-0 ${darkMode ? 'text-slate-600' : 'text-slate-400'}`}>{formatChatTime(message.created_at)}</span>
            {own && (
              <button type="button" onClick={() => onDelete(message)} disabled={deleting}
                aria-label="Delete message" title="Delete message"
                className={`-my-1 flex h-5 w-5 flex-shrink-0 items-center justify-center rounded-md transition-colors disabled:opacity-40 ${darkMode ? 'text-slate-600 hover:bg-red-500/15 hover:text-red-400' : 'text-slate-400 hover:bg-red-50 hover:text-red-500'}`}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </button>
            )}
          </div>
          {message.message_type === 'gif' ? (
            <div className={`overflow-hidden rounded-2xl border ${own ? 'rounded-tr-sm' : 'rounded-tl-sm'} ${darkMode ? 'border-slate-700 bg-slate-950' : 'border-slate-200 bg-slate-100'}`}>
              <img src={message.content} alt={`GIF from ${message.author?.display_name || 'ChainLens user'}`}
                className="block max-h-52 w-full object-contain" loading="lazy" onLoad={onMediaLoad} />
            </div>
          ) : (
            <div className={`inline-block px-3 py-2 rounded-2xl text-left text-xs leading-relaxed whitespace-pre-wrap break-words ${own
              ? 'rounded-tr-sm bg-cyan-500 text-slate-950'
              : darkMode ? 'rounded-tl-sm bg-slate-800 text-slate-100' : 'rounded-tl-sm bg-slate-100 text-slate-800'}`}>
              {renderChatText(message.content, allowLinks)}
            </div>
          )}
          {!own && message.author?.id && (
            <div className={`mt-1 font-mono text-[7px] truncate ${darkMode ? 'text-slate-700' : 'text-slate-300'}`}>{message.author.id}</div>
          )}
        </div>
      </div>
    );

    const ChatWidget = ({ open, onClose, onOpenProfile, darkMode, authToken, userProfile, unread, onUnreadRefresh }) => {
      const [tab, setTab] = useState('world');
      const [status, setStatus] = useState(null);
      const [statusLoading, setStatusLoading] = useState(false);
      const [messages, setMessages] = useState([]);
      const [messagesLoading, setMessagesLoading] = useState(false);
      const [friends, setFriends] = useState({ friends: [], incoming: [], outgoing: [] });
      const [friendsLoading, setFriendsLoading] = useState(false);
      const [selectedFriend, setSelectedFriend] = useState(null);
      const [directMessages, setDirectMessages] = useState([]);
      const [directLoading, setDirectLoading] = useState(false);
      const [friendId, setFriendId] = useState('');
      const [draft, setDraft] = useState('');
      const [sending, setSending] = useState(false);
      const [deletingMessageId, setDeletingMessageId] = useState(null);
      const [busyFriendship, setBusyFriendship] = useState(null);
      const [error, setError] = useState('');
      const [notice, setNotice] = useState('');
      const [showGifs, setShowGifs] = useState(false);
      const [gifQuery, setGifQuery] = useState('');
      const [gifs, setGifs] = useState([]);
      const [gifsLoading, setGifsLoading] = useState(false);
      const [showScrollToBottom, setShowScrollToBottom] = useState(false);
      const worldCursor = useRef(0);
      const directCursor = useRef(0);
      const feedRef = useRef(null);
      const shouldStickToBottom = useRef(true);
      const scrollingToBottom = useRef(false);
      const scrollSettleTimer = useRef(null);
      // Highest id already reported read per conversation, so the mark-read POST
      // does not re-fire on every 3s poll when nothing has changed.
      const markedRead = useRef({});

      const api = useCallback(async (url, options = {}) => {
        const response = await fetch(url, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`,
            ...(options.headers || {}),
          },
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || 'Messenger request failed');
        return body;
      }, [authToken]);

      const feedIsNearBottom = useCallback(() => {
        const feed = feedRef.current;
        if (!feed) return true;
        return feed.scrollHeight - feed.scrollTop - feed.clientHeight <= 56;
      }, []);

      const syncFeedScrollState = useCallback(() => {
        const nearBottom = feedIsNearBottom();
        if (scrollingToBottom.current && !nearBottom) return;
        if (nearBottom) scrollingToBottom.current = false;
        shouldStickToBottom.current = nearBottom;
        setShowScrollToBottom(!nearBottom);
      }, [feedIsNearBottom]);

      const scrollToChatBottom = useCallback((behavior = 'auto') => {
        const feed = feedRef.current;
        if (!feed) return;
        scrollingToBottom.current = true;
        shouldStickToBottom.current = true;
        setShowScrollToBottom(false);
        const applyScroll = () => {
          const currentFeed = feedRef.current;
          if (currentFeed) currentFeed.scrollTo({ top: currentFeed.scrollHeight, behavior });
        };
        requestAnimationFrame(() => {
          applyScroll();
          if (behavior === 'auto') requestAnimationFrame(applyScroll);
        });
        if (scrollSettleTimer.current) clearTimeout(scrollSettleTimer.current);
        scrollSettleTimer.current = setTimeout(() => {
          scrollingToBottom.current = false;
          const nearBottom = feedIsNearBottom();
          shouldStickToBottom.current = nearBottom;
          setShowScrollToBottom(!nearBottom);
        }, behavior === 'smooth' ? 500 : 80);
      }, [feedIsNearBottom]);

      const handleChatMediaLoad = useCallback(() => {
        if (shouldStickToBottom.current) scrollToChatBottom('auto');
        else syncFeedScrollState();
      }, [scrollToChatBottom, syncFeedScrollState]);

      const updateCursor = (cursorRef, rows) => {
        for (const row of rows || []) cursorRef.current = Math.max(cursorRef.current, Number(row.id) || 0);
      };

      const loadWorld = useCallback(async (incremental = false, quiet = false) => {
        if (!authToken) return;
        if (!incremental && !quiet) setMessagesLoading(true);
        try {
          const suffix = incremental ? `?after=${worldCursor.current}` : '';
          const body = await api(`/api/chat/world${suffix}`);
          updateCursor(worldCursor, body.messages);
          setMessages(current => incremental ? mergeChatMessages(current, body.messages) : (body.messages || []));
          if (!incremental && shouldStickToBottom.current) scrollToChatBottom('auto');
          setError('');
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          if (!incremental && !quiet) setMessagesLoading(false);
        }
      }, [api, authToken, scrollToChatBottom]);

      const loadFriends = useCallback(async (quiet = false) => {
        if (!authToken) return;
        if (!quiet) setFriendsLoading(true);
        try {
          const body = await api('/api/chat/friends');
          setFriends(body);
          setSelectedFriend(current => current && (body.friends || []).find(friend => friend.id === current.id) || null);
          setError('');
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          if (!quiet) setFriendsLoading(false);
        }
      }, [api, authToken]);

      const loadDirect = useCallback(async (friend, incremental = false, quiet = false) => {
        if (!friend || !authToken) return;
        if (!incremental && !quiet) setDirectLoading(true);
        try {
          const suffix = incremental ? `?after=${directCursor.current}` : '';
          const body = await api(`/api/chat/friends/${encodeURIComponent(friend.id)}/messages${suffix}`);
          updateCursor(directCursor, body.messages);
          setDirectMessages(current => incremental ? mergeChatMessages(current, body.messages) : (body.messages || []));
          if (!incremental && shouldStickToBottom.current) scrollToChatBottom('auto');
          setError('');
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          if (!incremental && !quiet) setDirectLoading(false);
        }
      }, [api, authToken, scrollToChatBottom]);

      useEffect(() => {
        setStatus(null);
        setMessages([]);
        setDirectMessages([]);
        setSelectedFriend(null);
        shouldStickToBottom.current = true;
        setShowScrollToBottom(false);
        worldCursor.current = 0;
        directCursor.current = 0;
      }, [authToken]);

      useEffect(() => () => {
        if (scrollSettleTimer.current) clearTimeout(scrollSettleTimer.current);
      }, []);

      useEffect(() => {
        if (!open || !authToken) return;
        let cancelled = false;
        setStatusLoading(true);
        api('/api/chat/status')
          .then(body => { if (!cancelled) { setStatus(body); setError(''); } })
          .catch(requestError => { if (!cancelled) setError(requestError.message); })
          .finally(() => { if (!cancelled) setStatusLoading(false); });
        return () => { cancelled = true; };
      }, [open, authToken, api]);

      useEffect(() => {
        if (!open || !status?.eligible || tab !== 'world') return;
        loadWorld(false);
        const pollInterval = setInterval(() => loadWorld(true), 3000);
        const reconcileInterval = setInterval(() => loadWorld(false, true), 15000);
        return () => { clearInterval(pollInterval); clearInterval(reconcileInterval); };
      }, [open, status?.eligible, tab, loadWorld]);

      useEffect(() => {
        if (!open || !status?.eligible || tab !== 'friends') return;
        loadFriends(false);
        const interval = setInterval(() => loadFriends(true), 6000);
        return () => clearInterval(interval);
      }, [open, status?.eligible, tab, loadFriends]);

      useEffect(() => {
        if (!open || !status?.eligible || !selectedFriend) return;
        directCursor.current = 0;
        setDirectMessages([]);
        loadDirect(selectedFriend, false);
        const pollInterval = setInterval(() => loadDirect(selectedFriend, true), 3000);
        const reconcileInterval = setInterval(() => loadDirect(selectedFriend, false, true), 15000);
        return () => { clearInterval(pollInterval); clearInterval(reconcileInterval); };
      }, [open, status?.eligible, selectedFriend?.id, loadDirect]);

      useEffect(() => {
        if (!open) return;
        shouldStickToBottom.current = true;
        scrollingToBottom.current = false;
        setShowScrollToBottom(false);
        scrollToChatBottom('auto');
      }, [open, selectedFriend?.id, tab, scrollToChatBottom]);

      // Report the newest message as read — but ONLY while the panel is open and
      // the user is actually at the bottom looking at it. Scrolled up, they have
      // not seen it, and clearing the cursor here would clear the badge on their
      // wallet for a message they never read.
      const markConversationRead = useCallback(() => {
        if (!open || !authToken || !status?.eligible) return;
        if (!shouldStickToBottom.current) return;
        const list = selectedFriend ? directMessages : messages;
        const newest = list.length ? Number(list[list.length - 1].id) : 0;
        if (!newest) return;
        const key = selectedFriend ? selectedFriend.id : 'world';
        if ((markedRead.current[key] || 0) >= newest) return;
        markedRead.current[key] = newest;
        api('/api/chat/read', {
          method: 'POST',
          body: JSON.stringify({ last_read_id: newest, ...(selectedFriend ? { friend_id: selectedFriend.id } : {}) }),
        })
          // World Chat is excluded from the badge, so only a DM needs a refresh.
          .then(() => { if (selectedFriend) onUnreadRefresh?.(); })
          .catch(() => { markedRead.current[key] = 0; });   // let a later tick retry
      }, [open, authToken, status?.eligible, selectedFriend, directMessages, messages, api, onUnreadRefresh]);

      useEffect(() => {
        if (!feedRef.current) return;
        if ((selectedFriend && directLoading) || (!selectedFriend && messagesLoading)) return;
        if (shouldStickToBottom.current) scrollToChatBottom('auto');
        else syncFeedScrollState();
        markConversationRead();
      }, [messages.length, directMessages.length, messagesLoading, directLoading, selectedFriend?.id, tab, scrollToChatBottom, syncFeedScrollState, markConversationRead]);

      const flashNotice = (value) => {
        setNotice(value);
        setTimeout(() => setNotice(''), 2500);
      };

      const sendMessage = async (type, content) => {
        if (sending) return;
        if (!selectedFriend && type === 'text' && chatTextContainsLink(content)) {
          setError('Links can only be sent in direct messages.');
          return;
        }
        setSending(true);
        setError('');
        try {
          const url = selectedFriend
            ? `/api/chat/friends/${encodeURIComponent(selectedFriend.id)}/messages`
            : '/api/chat/world';
          const body = await api(url, { method: 'POST', body: JSON.stringify({ type, content }) });
          shouldStickToBottom.current = true;
          setShowScrollToBottom(false);
          if (selectedFriend) {
            updateCursor(directCursor, [body.message]);
            setDirectMessages(current => mergeChatMessages(current, [body.message]));
          } else {
            updateCursor(worldCursor, [body.message]);
            setMessages(current => mergeChatMessages(current, [body.message]));
          }
          setDraft('');
          setShowGifs(false);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setSending(false);
        }
      };

      const deleteMessage = async (message) => {
        if (deletingMessageId !== null) return;
        if (!window.confirm('Delete this message? This cannot be undone.')) return;
        const messageId = String(message.id);
        setDeletingMessageId(messageId);
        setError('');
        try {
          const url = selectedFriend
            ? `/api/chat/friends/${encodeURIComponent(selectedFriend.id)}/messages/${encodeURIComponent(messageId)}`
            : `/api/chat/world/${encodeURIComponent(messageId)}`;
          await api(url, { method: 'DELETE' });
          if (selectedFriend) {
            setDirectMessages(current => current.filter(row => String(row.id) !== messageId));
          } else {
            setMessages(current => current.filter(row => String(row.id) !== messageId));
          }
          flashNotice('Message deleted');
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setDeletingMessageId(null);
        }
      };

      const sendFriendRequest = async (event) => {
        event.preventDefault();
        if (!friendId.trim()) return;
        setBusyFriendship('new');
        setError('');
        try {
          await api('/api/chat/friends', {
            method: 'POST',
            body: JSON.stringify({ chainlens_id: friendId.trim() }),
          });
          setFriendId('');
          flashNotice('Friend request sent');
          await loadFriends(true);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setBusyFriendship(null);
        }
      };

      const changeFriendship = async (friendship, action) => {
        setBusyFriendship(friendship.friendship_id);
        setError('');
        try {
          await api(`/api/chat/friends/${friendship.friendship_id}${action === 'accept' ? '/accept' : ''}`, {
            method: action === 'accept' ? 'POST' : 'DELETE',
          });
          flashNotice(action === 'accept' ? `${friendship.display_name} is now your friend` : 'Friend list updated');
          await loadFriends(true);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setBusyFriendship(null);
        }
      };

      const loadGifs = async (query = '') => {
        if (!status?.giphyApiKey) {
          setError('GIF search is waiting for GIPHY_API_KEY to be configured.');
          return;
        }
        setGifsLoading(true);
        setError('');
        try {
          const search = query.trim();
          const endpoint = search ? 'search' : 'trending';
          const url = new URL(`https://api.giphy.com/v1/gifs/${endpoint}`);
          url.searchParams.set('api_key', status.giphyApiKey);
          url.searchParams.set('limit', '30');
          url.searchParams.set('rating', 'pg-13');
          if (search) {
            url.searchParams.set('q', search.slice(0, 50));
            url.searchParams.set('lang', 'en');
          }
          const response = await fetch(url.toString());
          const body = await response.json();
          if (!response.ok || !Array.isArray(body.data)) throw new Error('GIPHY search is unavailable right now');
          setGifs(body.data.map(gif => ({
            id: gif.id,
            title: gif.title || 'GIPHY GIF',
            url: gif.images?.fixed_width?.url || gif.images?.downsized_medium?.url || gif.images?.original?.url,
            preview: gif.images?.fixed_width?.webp || gif.images?.fixed_width?.url || gif.images?.original?.url,
          })).filter(gif => gif.url && gif.preview));
        } catch (requestError) {
          setError(requestError.message || 'GIPHY search failed');
        } finally {
          setGifsLoading(false);
        }
      };

      const openGifPicker = () => {
        const next = !showGifs;
        setShowGifs(next);
        if (next && gifs.length === 0) loadGifs('');
      };

      if (!open) return null;

      const panel = darkMode ? 'bg-slate-900/95 border-slate-700 text-white' : 'bg-white/95 border-slate-200 text-slate-900';
      const muted = darkMode ? 'text-slate-500' : 'text-slate-400';
      const currentMessages = selectedFriend ? directMessages : messages;
      const currentLoading = selectedFriend ? directLoading : messagesLoading;
      // Server-side unread, so these counts match the wallet's on the same account.
      const unreadByFriend = new Map((unread?.conversations || []).map(row => [row.friend_id, row.unread]));
      const friendsTabBadge = (friends.incoming?.length || 0) + (unread?.unread_direct || 0);

      return (
        <section aria-label="ChainLens Messenger" data-testid="chat-panel"
          className={`w-[min(calc(100vw-2rem),430px)] h-[min(72vh,590px)] rounded-[1.5rem] border shadow-2xl backdrop-blur-xl overflow-hidden flex flex-col ${panel}`}
          style={{ animation: 'slideUp 0.2s ease-out both' }} onClick={event => event.stopPropagation()}>
          <header className={`px-4 pt-3 border-b ${darkMode ? 'border-slate-800' : 'border-slate-100'}`}>
            <div className="flex items-center justify-between gap-3 pb-3">
              <div className="flex items-center gap-2.5 min-w-0">
                <span className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-slate-950 shadow-lg shadow-cyan-500/20">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 5.5h16v11H8l-4 3v-14Z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/><path d="M8 10h8M8 13h5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                </span>
                <div className="min-w-0">
                  <p className={`text-[8px] font-black uppercase tracking-[0.2em] ${muted}`}>ChainLens</p>
                  <h2 className="font-heading font-extrabold text-sm truncate">Messenger</h2>
                </div>
              </div>
              <button onClick={onClose} aria-label="Close chat"
                className={`w-9 h-9 rounded-full flex items-center justify-center transition-colors ${darkMode ? 'bg-slate-800 text-slate-400 hover:bg-red-500 hover:text-white' : 'bg-slate-100 text-slate-500 hover:bg-red-500 hover:text-white'}`}>×</button>
            </div>
            <div className="grid grid-cols-2 gap-1">
              {[['world', 'World Chat'], ['friends', `Friends${friendsTabBadge ? ` (${friendsTabBadge})` : ''}`]].map(([value, label]) => (
                <button key={value} onClick={() => { setTab(value); setSelectedFriend(null); setShowGifs(false); setError(''); }}
                  className={`py-2.5 rounded-t-xl text-[10px] font-black uppercase tracking-widest border-b-2 transition-colors ${tab === value ? 'border-cyan-400 text-cyan-400' : `border-transparent ${muted}`}`}>
                  {label}
                </button>
              ))}
            </div>
          </header>

          {!authToken ? (
            <div className="flex-1 flex flex-col items-center justify-center text-center px-8">
              <span className="text-4xl mb-4">💬</span>
              <h3 className="font-heading font-extrabold text-lg">Sign in to chat</h3>
              <p className={`text-xs leading-relaxed mt-2 ${muted}`}>Messenger uses your synced ChainLens name, profile picture, and ID.</p>
              <button onClick={onOpenProfile} className="mt-5 px-5 py-3 rounded-xl bg-cyan-500 text-slate-950 text-xs font-black uppercase tracking-widest">Open Profile</button>
            </div>
          ) : statusLoading && !status ? (
            <div className={`flex-1 flex items-center justify-center text-xs ${muted}`}>Checking your account…</div>
          ) : status && !status.eligible ? (
            <div className="flex-1 flex flex-col items-center justify-center px-7 text-center">
              <span className="text-4xl mb-4">🔐</span>
              <h3 className="font-heading font-extrabold text-lg">Unlock Messenger</h3>
              <p className={`text-xs leading-relaxed mt-2 ${muted}`}>Chat requires one verified wallet and either Google or Discord on the same ChainLens account.</p>
              <div className={`w-full mt-5 rounded-2xl border overflow-hidden text-left ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                <div className={`px-4 py-3 flex items-center justify-between text-xs ${darkMode ? 'bg-slate-950/50' : 'bg-slate-50'}`}><span>Verified wallet</span><strong className={status.walletLinked ? 'text-emerald-400' : 'text-amber-400'}>{status.walletLinked ? 'Linked ✓' : 'Required'}</strong></div>
                <div className={`px-4 py-3 flex items-center justify-between text-xs border-t ${darkMode ? 'border-slate-800 bg-slate-950/50' : 'border-slate-200 bg-slate-50'}`}><span>Google or Discord</span><strong className={status.socialLinked ? 'text-emerald-400' : 'text-amber-400'}>{status.socialLinked ? 'Linked ✓' : 'Required'}</strong></div>
              </div>
              <button onClick={onOpenProfile} className="mt-5 px-5 py-3 rounded-xl bg-cyan-500 text-slate-950 text-xs font-black uppercase tracking-widest">Manage Profile</button>
            </div>
          ) : status?.eligible && tab === 'friends' && !selectedFriend ? (
            <div className="flex-1 min-h-0 overflow-y-auto p-3 space-y-4">
              <div className={`rounded-2xl border p-3 ${darkMode ? 'bg-slate-950/60 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                <div className={`text-[8px] font-black uppercase tracking-widest mb-1 ${muted}`}>Your ChainLens ID</div>
                <div className="flex items-center gap-2">
                  <span className="font-mono text-[9px] flex-1 break-all">{userProfile?.id}</span>
                  <button onClick={() => { navigator.clipboard.writeText(userProfile?.id || ''); flashNotice('ID copied'); }}
                    className="text-[9px] font-black uppercase tracking-widest text-cyan-400">Copy</button>
                </div>
              </div>
              <form onSubmit={sendFriendRequest} className="flex gap-2">
                <input value={friendId} onChange={event => setFriendId(event.target.value)} placeholder="Friend's ChainLens ID"
                  aria-label="Friend's ChainLens ID" maxLength="36"
                  className={`min-w-0 flex-1 rounded-xl border px-3 py-2.5 font-mono text-[10px] outline-none focus:border-cyan-400 ${darkMode ? 'bg-slate-950 border-slate-700' : 'bg-white border-slate-200'}`} />
                <button disabled={busyFriendship === 'new' || friendId.trim().length !== 36}
                  className="px-3 rounded-xl bg-cyan-500 text-slate-950 text-[9px] font-black uppercase tracking-widest disabled:opacity-40">Add</button>
              </form>

              {friendsLoading ? <div className={`text-xs text-center py-8 ${muted}`}>Loading friends…</div> : (
                <>
                  {(friends.incoming || []).length > 0 && <div className="space-y-2">
                    <div className={`text-[9px] font-black uppercase tracking-widest ${muted}`}>Friend requests</div>
                    {friends.incoming.map(request => (
                      <div key={request.friendship_id} className={`rounded-2xl border p-3 flex items-center gap-3 ${darkMode ? 'border-slate-800 bg-slate-950/50' : 'border-slate-200 bg-white'}`}>
                        <ChatAvatar profile={request} />
                        <div className="min-w-0 flex-1"><div className="text-xs font-bold truncate">{request.display_name}</div><div className={`font-mono text-[7px] truncate ${muted}`}>{request.id}</div></div>
                        <button onClick={() => changeFriendship(request, 'accept')} disabled={busyFriendship === request.friendship_id} className="text-[9px] font-black uppercase text-emerald-400">Accept</button>
                        <button onClick={() => changeFriendship(request, 'remove')} disabled={busyFriendship === request.friendship_id} aria-label="Decline friend request" className={`text-sm ${muted}`}>×</button>
                      </div>
                    ))}
                  </div>}

                  <div className="space-y-2">

                  ) : currentMessages.map(message => (

                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    Scroll to bottom

              <form onSubmit={event => { event.preventDefault(); sendMessage('text', draft); }}

                  className={`min-h-10 max-h-24 min-w-0 flex-1 resize-none rounded-xl border px-3 py-2.5 text-xs outline-none focus:border-cyan-400 ${darkMode ? 'bg-slate-950 border-slate-700' : 'bg-slate-50 border-slate-200'}`} />

          {(error || notice) && (

    };

    // ── Themes ────────────────────────────────────────────────────────────────
    //
    // The two base modes are always available; everything past them is the
    // MagicMoney theme set, and reaching it needs the same thing chat needs — a
    // ChainLens account with a verified wallet AND a Google or Discord login.
    // The colours themselves come from /theme-engine.js.

    const THEME_KEY = 'cl_theme';
    const BASE_MODES = [
      { id: 'light', name: 'Light', colors: { bg: '#f8fafc', accent: '#3b82f6', text: '#0f172a' } },
      { id: 'dark',  name: 'Dark',  colors: { bg: '#020617', accent: '#3b82f6', text: '#f8fafc' } },
    ];
    const isBaseMode = (id) => id === 'light' || id === 'dark';

    const readStoredThemeId = () => {
      try {
        // No cl_theme means an install from before themes existed: its darkMode
        // flag is the choice that has to be honoured, not reset to Light.
        return localStorage.getItem(THEME_KEY)
          || (localStorage.getItem('darkMode') === 'true' ? 'dark' : 'light');
      } catch { return 'light'; }
    };

    const readStoredDark = () => {
      try { return localStorage.getItem('darkMode') === 'true'; } catch { return false; }
    };

    /** The two-tone dot the picker identifies a theme by: background, then accent. */
    const ThemeSwatch = ({ colors }) => {
      const engine = window.chainlensThemes;
      const [bg, accent] = engine ? engine.swatchOf(colors) : [colors.bg, colors.accent];
      return (
        <span
          className="w-4 h-4 rounded-full border border-slate-400/40 shrink-0"
          style={{ background: `linear-gradient(135deg, ${bg} 0 50%, ${accent} 50% 100%)` }}
        />
      );
    };

    /**
     * The theme control in the top-right corner.
     *
     * Two shapes, and which one you get IS the feature: without an eligible
     * account this stays the Light/Dark switch it has always been, down to the
     * markup. With one, it opens the twelve themes MagicMoney ships plus
     * whatever the wallet has synced to the account.
     */
    const ThemePicker = ({ activeTheme, darkMode, eligible, builtins, customs, onSelect }) => {
      const [open, setOpen] = useState(false);
      const boxRef = useRef(null);

      // Close on an outside click or Escape. Registered only while open, so the
      // shut picker costs nothing.
      useEffect(() => {
        if (!open) return;
        const onDown = (event) => {
          if (boxRef.current && !boxRef.current.contains(event.target)) setOpen(false);
        };
        const onKey = (event) => { if (event.key === 'Escape') setOpen(false); };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [open]);

      const shell = darkMode
        ? 'bg-slate-900/80 border-slate-700'
        : 'bg-white/80 border-slate-200 shadow-md';

      if (!eligible) {
        return (
          <div data-testid="theme-toggle"
               className={`fixed top-4 right-4 z-50 flex items-center space-x-3 px-4 py-2.5 rounded-2xl border backdrop-blur-md transition-all ${shell}`}>
            <span className="text-[10px] font-bold uppercase tracking-widest opacity-60">{darkMode ? 'Dark' : 'Light'}</span>
            <div onClick={() => onSelect(darkMode ? 'light' : 'dark')}
                 role="switch" aria-checked={darkMode} aria-label="Dark mode"
                 className={`switch-bg rounded-full cursor-pointer ${darkMode ? 'bg-blue-600' : 'bg-slate-300'}`}>
              <div className={`switch-dot rounded-full bg-white shadow-lg ${darkMode ? 'translate-x-6' : 'translate-x-0'}`} />
            </div>
          </div>
        );
      }

      const row = (theme) => {
        const selected = theme.id === activeTheme.id;
        return (
          <button key={theme.id} onClick={() => { onSelect(theme.id); setOpen(false); }}
                  data-testid={`theme-option-${theme.id}`} aria-current={selected ? 'true' : undefined}
                  className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-left transition-colors ${selected
                    ? (darkMode ? 'bg-slate-800' : 'bg-slate-100')
                    : (darkMode ? 'hover:bg-slate-800/60' : 'hover:bg-slate-50')}`}>
            <ThemeSwatch colors={theme.colors} />
            <span className="flex-1 truncate text-[11px] font-bold">{theme.name}</span>
            {selected && <span className="text-cyan-400 text-xs leading-none">✓</span>}
          </button>
        );
      };

      const heading = (text) => (
        <p className={`px-3 pt-3 pb-1 text-[9px] font-black uppercase tracking-widest ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>{text}</p>
      );

      return (
        <div ref={boxRef} data-testid="theme-picker" className="fixed top-4 right-4 z-50">
          <button onClick={() => setOpen(v => !v)} aria-expanded={open} aria-haspopup="menu"
                  data-testid="theme-picker-button"
                  className={`flex items-center space-x-2.5 px-4 py-2.5 rounded-2xl border backdrop-blur-md transition-all ${shell}`}>
            <ThemeSwatch colors={activeTheme.colors} />
            <span className="text-[10px] font-bold uppercase tracking-widest opacity-70 max-w-28 truncate">{activeTheme.name}</span>
            <span className={`text-[8px] transition-transform ${open ? 'rotate-180' : ''}`}>▼</span>
          </button>

          {open && (
            <div role="menu" data-testid="theme-menu"
                 className={`absolute right-0 mt-2 w-56 max-h-[70vh] overflow-y-auto rounded-2xl border backdrop-blur-md p-1.5 shadow-xl ${darkMode ? 'bg-slate-900/95 border-slate-700 dark-scroll' : 'bg-white/95 border-slate-200'}`}>
              {heading('Mode')}
              {BASE_MODES.map(row)}
              {heading('MagicMoney')}
              {builtins.map(row)}
              {heading('Your themes')}
              {customs.length > 0 ? customs.map(row) : (
                <p className={`px-3 pb-3 pt-1 text-[10px] leading-relaxed ${darkMode ? 'text-slate-500' : 'text-slate-400'}`}>
                  Themes you build in MagicMoney Wallet appear here.
                </p>
              )}
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [activeTab, setActiveTab] = useState('search');
      const [evmAddr, setEvmAddr] = useState('');
      const [solAddr, setSolAddr] = useState('');
      const [adaAddr, setAdaAddr] = useState('');
      const [activeChains, setActiveChains] = useState(() => DEFAULT_CHAINS.map(chain => chain.id));
      
      const [nfts, setNfts] = useState([]);
      const [loading, setLoading] = useState(false);
      // darkMode stays the switch every utility class branches on; what changed
      // is who sets it. A theme's TONE now decides it, so a light theme cannot
      // end up rendered through the dark branch.
      const [darkMode, setDarkMode] = useState(readStoredDark);
      const [themeId, setThemeId] = useState(readStoredThemeId);
      // Whether this account may use themes at all, and which ones MagicMoney
      // has synced to it. One request answers both.
      const [themeAccess, setThemeAccess] = useState({ eligible: false, entries: {} });
      const [selectedAsset, setSelectedAsset] = useState(null);
      const [tokenMode, setTokenMode] = useState(false);
      const [viewMode, setViewMode] = useState('nfts'); // 'nfts', 'tokens', 'transactions'
      const [transactions, setTransactions] = useState([]);
      const [isListView, setIsListView] = useState(false);
      
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('chain'); 

      const [resolvedEvm, setResolvedEvm] = useState(null);
      const [isResolving, setIsResolving] = useState(false);
      const [scanIssues, setScanIssues] = useState([]);

      // Canonical asset key → { s: 'h' hidden | 's' spam | 'a' restored, t: ms }.
      // 'a' is a TOMBSTONE, not an absence: the wallet on another device still
      // holds the older hide, and only a NEWER decision can outrank it. Dropping
      // the key instead would let that device put the asset straight back.
      const [filterEntries, setFilterEntries] = useState(loadStoredFilters);
      const [showManager, setShowManager] = useState(false);

      const hiddenIds = useMemo(
        () => Object.keys(filterEntries).filter(k => filterEntries[k].s === 'h'), [filterEntries]);
      const spamIds = useMemo(
        () => Object.keys(filterEntries).filter(k => filterEntries[k].s === 's'), [filterEntries]);

      // Read by the debounced push, which fires long after the render that
      // scheduled it — a ref is what stops it pushing a stale list.
      const filterEntriesRef = useRef(filterEntries);
      filterEntriesRef.current = filterEntries;
      // Only a user decision should trigger a push. Without this, merging the
      // server's reply would schedule another push of the same data, forever.
      const filtersDirty = useRef(false);
      const filterPushTimer = useRef(null);

      // Every write goes through here, so local storage and the push stay in step.
      const setFilterState = useCallback((assets, state) => {
        const keys = (Array.isArray(assets) ? assets : [assets])
          .map(a => (typeof a === 'string' ? a : assetKeyFor(a)))
          .filter(Boolean);
        if (keys.length === 0) return;
        const t = Date.now();
        filtersDirty.current = true;
        setFilterEntries(prev => {
          const next = Object.assign({}, prev);
          keys.forEach(key => { next[key] = { s: state, t }; });
          saveStoredFilters(next);
          return next;
        });
      }, []);

      const [marketData, setMarketData] = useState(() => {
        try {
          const raw = sessionStorage.getItem('cl_market_v1');
          if (raw) {
            const { data, ts } = JSON.parse(raw);
            if (Array.isArray(data) && data.length > 0 && Date.now() - ts < 120000) return data;
          }
        } catch {}
        return [];
      });
      const [marketLoading, setMarketLoading] = useState(false);
      const [marketSearch, setMarketSearch] = useState('');
      const [selectedCoin, setSelectedCoin] = useState(null);
      const [showChart, setShowChart] = useState(false);
      const [chartData, setChartData] = useState(null);
      const [loadingChart, setLoadingChart] = useState(false);
      const [chartTimeframe, setChartTimeframe] = useState('7d'); // 1d, 7d, 1m, 1y, all
      const [nativePrices, setNativePrices] = useState({}); // { ETH: 3000, SOL: 85, ADA: 0.72, MON: 0.02 }
      const [convCoin, setConvCoin] = useState('');   // coin amount input
      const [convUsd, setConvUsd] = useState('');     // usd amount input

      const [appHubData, setAppHubData] = useState(null);
      const [appHubLoading, setAppHubLoading] = useState(false);
      const [appHubSearch, setAppHubSearch] = useState('');
      const [appHubCategory, setAppHubCategory] = useState('all');
      const [appHubChain, setAppHubChain] = useState('all');
      const [appHubSort, setAppHubSort] = useState('coverage');
      const [expandedAppChains, setExpandedAppChains] = useState(new Set());
      const [featuredOffset, setFeaturedOffset] = useState(0);

      // ── Refs for memory-safe cleanup ──────────────────────────────────────
      const chartInstanceRef = useRef(null);   // holds the Chart.js instance
      const scanAbortRef = useRef(null);       // AbortController for in-flight scans

      // ── Auth & Profile state ───────────────────────────────────────────────
      const [authToken, setAuthToken] = useState(() => localStorage.getItem('cl_token'));
      const [userProfile, setUserProfile] = useState(null);
      const [authLoading, setAuthLoading] = useState(false);
      const [walletConnecting, setWalletConnecting] = useState(null); // 'evm'|'solana'|'cardano'|'google'|'discord'
      const [walletPickerType, setWalletPickerType] = useState(null);
      const [walletProviders, setWalletProviders] = useState([]);
      const [walletDiscovering, setWalletDiscovering] = useState(false);
      const [pasteMode, setPasteMode] = useState(false);
      const [pasteAddr, setPasteAddr] = useState('');
      const [pasteError, setPasteError] = useState('');
      const [autoScan, setAutoScan] = useState(false);
      const [showEvmChains, setShowEvmChains] = useState(false);
      const [showSolChains, setShowSolChains] = useState(false);
      const [showAdaChains, setShowAdaChains] = useState(false);
      const [editingWallet, setEditingWallet] = useState(null); // wallet id being renamed
      const [walletLabelInput, setWalletLabelInput] = useState('');
      const [profileError, setProfileError] = useState(null);
      const [editingName, setEditingName] = useState(false);
      const [nameInput, setNameInput] = useState('');
      // ── Passkeys (WebAuthn) ───────────────────────────────────────────────
      // Both the browser AND the server must support them, so every passkey
      // control stays hidden until `passkeyAvailable` is confirmed — a button
      // that fails when pressed is worse than no button.
      const [passkeyAvailable, setPasskeyAvailable] = useState(false);
      // Tracked separately from the server check: a browser with no WebAuthn
      // used to make the whole section disappear with no explanation, which
      // reads as a broken site rather than an unsupported browser.
      const [passkeyBrowserOk] = useState(() => typeof window.PublicKeyCredential === 'function');
      const [passkeys, setPasskeys] = useState([]);
      const [passkeyBusy, setPasskeyBusy] = useState(false);
      const [showAvatarEditor, setShowAvatarEditor] = useState(false);
      const [avatarMode, setAvatarMode] = useState('nft');
      const [avatarSelection, setAvatarSelection] = useState('');
      const [avatarSaving, setAvatarSaving] = useState(false);
      const [avatarError, setAvatarError] = useState('');
      const avatarFileInputRef = useRef(null);

      const [showDonate, setShowDonate] = useState(false);
      const [copiedDonate, setCopiedDonate] = useState(null);
      const [showWallet, setShowWallet] = useState(false);
      const [showSimpleSwap, setShowSimpleSwap] = useState(false);
      const [simpleSwapLoaded, setSimpleSwapLoaded] = useState(false);
      const [showChat, setShowChat] = useState(false);
      // Messenger badge — pending friend requests + unread DMs, counted
      // server-side (sql/cl_chat.sql) so this agrees with MagicMoney Wallet on
      // the same account. World Chat is deliberately excluded: it is busy enough
      // that a badge tied to it would never clear.
      const [chatUnread, setChatUnread] = useState(null);
      const refreshChatUnread = useCallback(() => {
        if (!authToken) { setChatUnread(null); return; }
        fetch('/api/chat/unread', { headers: { Authorization: `Bearer ${authToken}` } })
          .then(response => (response.ok ? response.json() : null))
          // Not eligible / not signed in / offline. A header dot is not worth an
          // error surface; the widget itself explains what is missing.
          .then(body => setChatUnread(body))
          .catch(() => setChatUnread(null));
      }, [authToken]);
      useEffect(() => {
        if (!authToken) { setChatUnread(null); return; }
        refreshChatUnread();
        // One lightweight aggregate, not a poll per conversation.
        const interval = setInterval(refreshChatUnread, 20000);
        return () => clearInterval(interval);
      }, [authToken, refreshChatUnread]);
      const chatBadge = (chatUnread?.pending_requests || 0) + (chatUnread?.unread_direct || 0);
      // The visible badge is a bare number, so the accessible name has to carry
      // what it counts. Kept prefixed with "Chat" so the control still reads as
      // itself first and the state second.
      const chatBadgeLabel = chatBadge === 0 ? 'Chat' : `Chat — ${[
        chatUnread?.pending_requests ? `${chatUnread.pending_requests} friend request${chatUnread.pending_requests === 1 ? '' : 's'}` : '',
        chatUnread?.unread_direct ? `${chatUnread.unread_direct} unread message${chatUnread.unread_direct === 1 ? '' : 's'}` : '',

      // ── Themes ──────────────────────────────────────────────────────────────
      //

      useEffect(() => {

          .then(res => (res.ok ? res.json() : null))
          .then(body => {

        const engine = window.chainlensThemes;
        if (!engine || isBaseMode(id)) return null;

      // an eligible account behind it, so when that is missing — signed out, or
      // a custom theme this account no longer has — the base mode stands in.
      // The stored id is deliberately left alone: it comes back on sign-in.
      const activeTheme = useMemo(() => {
        if (isBaseMode(themeId)) return BASE_MODES[themeId === 'dark' ? 1 : 0];

        // Only a theme that cannot be resolved has to guess, and darkMode is

        const engine = window.chainlensThemes;

          tone = engine.applyTheme(theme.colors);

          // dark theme was looking at a dark app, and flipping them to white is
          // the jarring answer.

      // means "no answer", which is NOT "nothing hidden" — treating them alike
      // would show the user every scam airdrop they had already dismissed.
      useEffect(() => {
        if (!authToken) return;
        let cancelled = false;

            const res = await fetch('/api/profile/filters', { headers: { Authorization: `Bearer ${authToken}` } });
            if (!res.ok) return;

            if (cancelled || !body || !body.entries) return;

            filterEntriesRef.current = merged;
            saveStoredFilters(merged);
            setFilterEntries(merged);

              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
              body: JSON.stringify({ entries: merged }),
            });
          } catch {}
        })();
        return () => { cancelled = true; };
      }, [authToken]);

      // devices, so applying it is how a hide made in the wallet arrives here.
      useEffect(() => {
        if (!authToken || !filtersDirty.current) return;
        filtersDirty.current = false;
        if (filterPushTimer.current) clearTimeout(filterPushTimer.current);

            const res = await fetch('/api/profile/filters', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${authToken}` },
              body: JSON.stringify({ entries: filterEntriesRef.current }),

            if (!res.ok) return;
            const body = await res.json();
            if (!body || !body.entries) return;

      // ── Auth helper: authenticated fetch ──────────────────────────────────
      const authFetch = (url, opts = {}) => fetch(url, {
        ...opts,
        headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${authToken}`, ...opts.headers }
      });

      const logout = () => {
        setAuthToken(null); setUserProfile(null); setPasskeys([]);

      };

      // ── Passkey sign-in ─────────────────────────────────────────────────────
      // A passkey is a keypair your device generates and keeps. Signing in means
      // signing a one-time challenge from the server, so there is no password to
      // phish, reuse, or leak — and the database holds only the public half.
      //
      // WebAuthn speaks ArrayBuffers while JSON speaks strings, so every
      // challenge and credential id is base64url on the wire. Hand-rolled rather
      // than using PublicKeyCredential.toJSON(), which is still too new to rely
      // on across the browsers ChainLens supports.
      const b64uToBuf = (s) => {
        const b64 = String(s).replace(/-/g, '+').replace(/_/g, '/');
        const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      };
      const bufToB64u = (buf) => {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      };

      const toCreateOptions = (o) => ({
        ...o,
        challenge: b64uToBuf(o.challenge),
        user: { ...o.user, id: b64uToBuf(o.user.id) },
        excludeCredentials: (o.excludeCredentials || []).map(c => ({ ...c, id: b64uToBuf(c.id) })),
      });
      const toGetOptions = (o) => ({
        ...o,
        challenge: b64uToBuf(o.challenge),
        allowCredentials: (o.allowCredentials || []).map(c => ({ ...c, id: b64uToBuf(c.id) })),
      });
      const regToJSON = (cred) => ({
        id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
        authenticatorAttachment: cred.authenticatorAttachment || undefined,
        clientExtensionResults: cred.getClientExtensionResults(),
        response: {
          clientDataJSON: bufToB64u(cred.response.clientDataJSON),
          attestationObject: bufToB64u(cred.response.attestationObject),
          transports: cred.response.getTransports ? cred.response.getTransports() : [],
        },
      });
      const authToJSON = (cred) => ({
        id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
        authenticatorAttachment: cred.authenticatorAttachment || undefined,
        clientExtensionResults: cred.getClientExtensionResults(),
        response: {
          clientDataJSON: bufToB64u(cred.response.clientDataJSON),
          authenticatorData: bufToB64u(cred.response.authenticatorData),
          signature: bufToB64u(cred.response.signature),
          userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : undefined,
        },
      });

      // Feature-detect once: the browser must implement WebAuthn and the server
      // must have both the library and the cl_passkeys table.
      // Asked regardless of browser support, so the card can still render and
      // explain itself on a browser that can't do WebAuthn.
      useEffect(() => {
        fetch('/api/auth/passkey/available')
          .then(r => r.json())
          .then(d => setPasskeyAvailable(!!d.available))
          .catch(() => {});
      }, []);

      // The passkey list lives outside /api/profile on purpose: if the table is
      // missing, this returns an empty list instead of breaking the profile.
      useEffect(() => {
        if (!authToken || !passkeyAvailable) { setPasskeys([]); return; }
        fetch('/api/auth/passkey/list', { headers: { Authorization: `Bearer ${authToken}` } })
          .then(r => r.json())
          .then(d => setPasskeys(d.passkeys || []))
          .catch(() => {});
      }, [authToken, passkeyAvailable]);

      const signInWithPasskey = async () => {
        setProfileError(null);
        setPasskeyBusy(true);
        try {
          const start = await fetch('/api/auth/passkey/login-options', { method: 'POST' }).then(r => r.json());
          if (!start.options) throw new Error(start.error || 'Passkey sign-in is unavailable right now');
          // No credential list is sent, so the device offers whichever ChainLens
          // passkeys it holds and the user picks — no email or username needed.
          const cred = await navigator.credentials.get({ publicKey: toGetOptions(start.options) });
          if (!cred) throw new Error('No passkey was selected');
          const res = await fetch('/api/auth/passkey/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ response: authToJSON(cred), ceremony: start.ceremony }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Passkey sign-in failed');
          setAuthToken(data.token);
          localStorage.setItem('cl_token', data.token);
          if (data.profile) setUserProfile(data.profile);
        } catch (e) {

          // device had no passkey for this site" — the spec deliberately makes
          // them indistinguishable so a site cannot probe who has an account.
          // Staying silent was wrong: the user pressed a button and nothing
          // whatsoever happened, which reads as a broken page. Say something
          // that is true of either case.
          if (e.name === 'NotAllowedError') {
            setProfileError('No passkey was used. If you’re in an app’s built-in browser, that’s expected — password managers only release passkeys to browsers they recognise. Open ChainLens in Chrome, Samsung Internet, or Brave, or sign in with Google or Discord instead.');
          } else {
            setProfileError(e.message || 'Passkey sign-in failed');
          }

        setPasskeyBusy(false);

      // ADDED to an account rather than creating one. Losing every passkey
      // therefore never locks anyone out — Google, Discord and wallet sign-in
      // all still work.
      const addPasskey = async () => {
        setProfileError(null);
        setPasskeyBusy(true);
        try {
          const start = await authFetch('/api/auth/passkey/register-options', { method: 'POST' }).then(r => r.json());
          if (!start.options) throw new Error(start.error || 'Passkeys are unavailable right now');
          const cred = await navigator.credentials.create({ publicKey: toCreateOptions(start.options) });
          if (!cred) throw new Error('No passkey was created');
          const res = await authFetch('/api/auth/passkey/register', {
            method: 'POST',
            body: JSON.stringify({ response: regToJSON(cred), ceremony: start.ceremony }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not add that passkey');
          setPasskeys(data.passkeys || []);
        } catch (e) {

          // already holds a passkey for this account. That is success, not failure
          // — the existing one already works in EVERY browser on the device,
          // because passkeys live in the OS password manager, not in a browser.
          // Saying only "already has one" left people trying to add another.
          // Android overloads InvalidStateError for two unrelated things, and
          // guessing between them misleads people badly:
          //  1. excludeCredentials matched — you genuinely already have one.
          //  2. The credential provider REFUSED THE APP. Samsung Pass returns
          //     "Can't use passkeys with this browser." here (measured on a
          //     Galaxy S21+ inside an in-app WebView). Password managers only
          //     release site passkeys to browsers they recognise, so an
          //     embedded browser cannot use them however it is configured.
          // Prefer the platform's own wording when it explains itself.
          if (e.name === 'InvalidStateError') {
            const msg = String(e.message || '');
            setProfileError(/browser/i.test(msg)
              ? msg + ' Password managers only hand passkeys to browsers they recognise, so in-app browsers can’t use them. Open ChainLens in Chrome, Samsung Internet, or Brave.'
              // NOT "on this device". Seed-derived authenticators (Magic Money)
              // recompute credentials from the recovery phrase, so a passkey
              // created on one device is recognised as already existing on every
              // other device holding the same phrase — and refusing to duplicate
              // it is correct. Saying "this device" made that read as a bug.
              : 'You already have a passkey for ChainLens — sign out and use “Sign in with a passkey” to use it. Some password managers share one passkey across all your devices, so you may not need another.');
          }
          else if (e.name !== 'NotAllowedError') setProfileError(e.message || 'Could not add that passkey');
        }
        setPasskeyBusy(false);

      const removePasskey = async (id) => {
        if (!confirm('Remove this passkey? You will no longer be able to sign in with it.')) return;

        setPasskeyBusy(true);

          const res = await authFetch(`/api/auth/passkey/${id}`, { method: 'DELETE' });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to remove passkey');
          setPasskeys(data.passkeys || []);
        } catch (e) {
          setProfileError(e.message || 'Failed to remove passkey');
        }
        setPasskeyBusy(false);

        // ── NFT / asset download helper ─────────────────────────────────────────
      const downloadAsset = async (url, name) => {
        const src = (url && url.indexOf('ipfs://') === 0)
          ? 'https://ipfs.io/ipfs/' + url.slice(7) : url || '';
        if (!src) return;
        try {
          const res = await fetch(src);
          const blob = await res.blob();
          const ext = blob.type.includes('png') ? 'png' : blob.type.includes('gif') ? 'gif' : blob.type.includes('svg') ? 'svg' : 'jpg';
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = ((name || 'nft').replace(/[^a-z0-9_\-]/gi, '_') + '.' + ext).toLowerCase();
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        } catch {
          window.open(src, '_blank');
        }

          // ── Social logins (redirect to backend OAuth) ─────────────────────────
      const loginWithGoogle  = () => {

      };

        setWalletConnecting('discord');
